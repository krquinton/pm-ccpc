<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f332e">
<title>Game schedule · PickleManage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#262a26; --muted:#667066; --line:#e3e5e2; --bg:#f4f5f3; --card:#ffffff; --soft:#f7f8f6;
    --green:#3f8f22; --green-soft:#e6f3df; --blue:#1f7fb8; --blue-soft:#e3f1f9; --amber:#b86a00; --amber-soft:#fff1dc;
    --dark:#2f332e; --dark2:#222622; --hl:#fff0a8; --win:#1f6f0f;
    --shadow:0 1px 2px rgba(30,40,30,.06), 0 6px 18px rgba(30,40,30,.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.4;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  header.top{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:22px clamp(16px,4vw,40px) 20px;}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand img{width:46px;height:46px;border-radius:10px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .brand h1{margin:0;font-family:'Baloo 2',sans-serif;font-size:clamp(20px,4.4vw,30px);line-height:1.05;font-weight:800;overflow-wrap:anywhere;}
  .brand .sub{font-size:13.5px;color:#c9d3c9;margin-top:2px;}
  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c9d3c9;font-weight:500;}
  .dot{width:9px;height:9px;border-radius:50%;background:#6cc144;box-shadow:0 0 0 0 rgba(108,193,68,.7);animation:pulse 2s infinite;}
  .dot.off{background:#d98a2b;animation:none;}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(108,193,68,0);}100%{box-shadow:0 0 0 0 rgba(108,193,68,0);}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none;}}

  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,24px);}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);min-width:96px;}
  .stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:21px;line-height:1.1;}
  .stat span{font-size:12px;color:var(--muted);font-weight:500;}

  .tabs{display:flex;gap:6px;margin-top:16px;}
  .tab{padding:8px 18px;border-radius:10px;font:600 14px 'Inter',sans-serif;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);}
  .tab.on{background:var(--green);border-color:var(--green);color:#fff;}
  .events{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .ev{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer;}
  .ev[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark);}

  .tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin-top:6px;}
  .search{position:relative;}
  .search input{width:100%;font:500 16px 'Inter',sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 42px;box-shadow:var(--shadow);}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px;display:none;}
  .search.has button{display:block;}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 13px;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap;}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;}
  .chip .n{opacity:.7;font-weight:500;margin-left:4px;}
  .resline{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px;min-height:20px;}
  .resline button{background:none;border:none;color:var(--blue);font:600 12.5px 'Inter',sans-serif;cursor:pointer;padding:2px 4px;}

  .table{margin:6px 0 24px;}
  .ghead,.grow{display:grid;grid-template-columns:78px 96px minmax(110px,1fr) minmax(130px,1.5fr) minmax(130px,1.5fr) 170px 76px;gap:12px;align-items:center;}
  .ghead{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);}
  .grow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:8px;box-shadow:var(--shadow);}
  .grow.playing{border-left-color:var(--green);background:linear-gradient(90deg,var(--green-soft),var(--card) 40%);}
  .grow.called{border-left-color:var(--blue);}
  .grow.done{border-left-color:var(--muted);}
  .grow.done .tm{color:var(--ink);}
  .gno{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;}
  .est{font-weight:700;font-variant-numeric:tabular-nums;}
  .est small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
  .cat{font-size:13px;color:var(--muted);font-weight:500;}
  .tm{font-weight:600;overflow-wrap:anywhere;}
  .tm.win{color:var(--win);font-weight:700;}
  .wh{display:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px;}
  .st{display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line);}
  .badge.playing{background:var(--green);color:#fff;border-color:var(--green);}
  .badge.called{background:var(--blue-soft);color:var(--blue);border-color:transparent;}
  .badge.done{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .score{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;}
  .score.none{color:var(--muted);font-weight:500;}
  .brk{display:flex;align-items:center;gap:12px;margin:4px 0 12px;color:var(--amber);font-weight:700;font-size:13px;}
  .brk::before,.brk::after{content:"";flex:1;height:1px;background:var(--amber);opacity:.4;}
  .brk span{background:var(--amber-soft);border-radius:20px;padding:4px 14px;}
  .empty{text-align:center;color:var(--muted);padding:44px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px;}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;padding:8px 16px 30px;}
  .foot .u{display:block;margin-top:3px;font-size:11.5px;}

  @media (max-width:820px){
    .ghead{display:none;}
    .grow{grid-template-columns:auto 1fr auto;grid-template-areas:"g e s" "c c c" "a a a" "b b b" "w w sc";gap:4px 10px;padding:12px 14px;}
    .grow > [data-c="g"]{grid-area:g;} .grow > [data-c="e"]{grid-area:e;} .grow > [data-c="s"]{grid-area:s;justify-self:end;}
    .grow > [data-c="c"]{grid-area:c;} .grow > [data-c="a"]{grid-area:a;font-size:16px;} .grow > [data-c="b"]{grid-area:b;font-size:16px;}
    .grow > [data-c="w"]{grid-area:w;align-self:center;display:block;} .grow > [data-c="sc"]{grid-area:sc;}
    .grow > [data-c="b"]::before{content:"vs ";color:var(--muted);font-weight:400;}
    .est small{display:inline;margin-left:6px;}
    .grow .st{flex-direction:row;align-items:center;}
    .grow .st .when{display:none;}
    .grow > [data-c="w"]{font-size:12px;color:var(--muted);}
  }
</style>
</head>

  const words = s => fold(s).match(/[a-z0-9]+/g) || [];
  function lev(a, b){
    if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length:n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }
  function tokMatch(q, t){
    if (t.startsWith(q)) return true;
    if (q.length >= 3 && t.includes(q)) return true;
    const tol = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0; if (!tol) return false;
    return lev(q, t.slice(0, q.length)) <= tol || lev(q, t) <= tol;
  }
  const qTokens = () => words(query);
  function gameMatches(g, toks){
    if (!toks.length) return true;
    const ws = words([g.no, ...(g.t1 || []), ...(g.t2 || [])].join(' '));
    return toks.every(q => ws.some(t => tokMatch(q, t)));
  }
  function hl(text, toks){
    const s = String(text || ''); if (!toks.length) return esc(s);
    return s.split(/([A-Za-z0-9\u00C0-\u024F]+)/).map((p, i) => (i % 2 && toks.some(q => tokMatch(q, fold(p)))) ? `<mark>${esc(p)}</mark>` : esc(p)).join('');
  }

  /* ---------- load ---------- */
  const urlId = new URLSearchParams(location.search).get('e');
  function setLive(ok, txt){ $('liveDot').classList.toggle('off', !ok); $('liveTxt').textContent = txt; }
  async function init(){
    try {
      const snap = await db.collection('pkl-public-schedules').orderBy('updatedAtMs', 'desc').limit(30).get();
      events = snap.docs.map(d => ({ id:d.id, title:(d.data().eventName || 'Event'), date:d.data().dateText || '' }));
    } catch (err) { events = []; if (!urlId) return fail(err); }
    if (!events.length && !urlId) return emptyAll();
    renderEvents();
    open(urlId || events[0].id);
  }
  function fail(err){
    setLive(false, 'Offline');
    $('evSub').textContent = '';
    $('table').innerHTML = `<div class="empty"><b>The schedule isn’t available right now</b>${err && err.code === 'permission-denied' ? 'It hasn’t been published yet.' : 'Check your connection and try again.'}</div>`;
  }
  function emptyAll(){
    setLive(false, 'No schedule yet'); $('evSub').textContent = '';
    $('table').innerHTML = '<div class="empty"><b>No schedule has been published yet</b>Check back soon.</div>';
  }
  function renderEvents(){
    const box = $('events');
    if (events.length < 2){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = events.map(e => `<button class="ev" data-id="${esc(e.id)}" aria-pressed="${e.id === curId}">${esc(e.title)}${e.date ? ' · ' + esc(e.date) : ''}</button>`).join('');
  }
  $('events').addEventListener('click', e => { const b = e.target.closest('.ev'); if (b) open(b.dataset.id); });

  function open(id){
    if (unsubS) unsubS(); if (unsubT) unsubT();
    curId = id; sched = null; status = {}; selCats.clear(); renderEvents();
    $('tabBoard').href = 'scoreboard.html?e=' + encodeURIComponent(id);
    try { history.replaceState(null, '', '?e=' + encodeURIComponent(id)); } catch(e){}
    unsubS = db.collection('pkl-public-schedules').doc(id).onSnapshot(s => {
      if (!s.exists){ sched = null; $('tools').hidden = true; $('stats').innerHTML = ''; $('table').innerHTML = '<div class="empty"><b>This schedule isn’t published</b>Check the link or ask the organizers.</div>'; setLive(false, 'Not found'); return; }
      sched = s.data(); setLive(true, 'Live'); render();
    }, fail);
    unsubT = db.collection('pkl-public-status').doc(id).onSnapshot(s => { status = s.exists ? (s.data().games || {}) : {}; render(); }, () => {});
  }

  /* ---------- render ---------- */
  function stateOf(g){ const s = status[g.no]; return s ? s.s : 'upcoming'; }
  function render(){
    if (!sched) return;
    const games = sched.games || [];
    document.title = (sched.eventName || 'Game schedule') + ' · Schedule';
    $('evTitle').textContent = sched.eventName || 'Game schedule';
    $('brandImg').src = sched.logo || DEFAULT_LOGO;
    $('evSub').textContent = [sched.dateText, sched.venue].filter(Boolean).join(' · ');
    $('tools').hidden = !games.length;
    const counts = { playing:0, done:0 }; games.forEach(g => { const s = stateOf(g); if (counts[s] !== undefined) counts[s]++; });
    const last = games.reduce((m, g) => Math.max(m, g.startMin + (sched.minutes || 0)), 0);
    $('stats').innerHTML = [[games.length, 'games'], [games.length ? fmtMin(games[0].startMin) : '–', 'first game'], [games.length ? fmtMin(last) : '–', 'est. finish'], [counts.playing, 'playing now'], [counts.done, 'finished']]
      .map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join('');

    // category chips
    const cats = {}; games.forEach(g => { cats[g.cat] = (cats[g.cat] || 0) + 1; });
    const names = Object.keys(cats).sort((a, b) => a.localeCompare(b));
    [...selCats].forEach(c => { if (!cats[c]) selCats.delete(c); });
    $('chips').innerHTML = `<button class="chip" data-cat="" aria-pressed="${selCats.size === 0}">All<span class="n">${games.length}</span></button>` +
      names.map(n => `<button class="chip" data-cat="${esc(n)}" aria-pressed="${selCats.has(n)}">${esc(n)}<span class="n">${cats[n]}</span></button>`).join('');

    const toks = qTokens();
    const shown = games.filter(g => (!selCats.size || selCats.has(g.cat)) && gameMatches(g, toks));
    const filtered = toks.length > 0 || selCats.size > 0;
    $('resTxt').textContent = filtered ? `${shown.length} of ${games.length} games` : '';
    $('clearAll').hidden = !filtered;

    if (!games.length){ $('table').innerHTML = '<div class="empty"><b>No games yet</b>The schedule is being prepared.</div>'; return; }
    if (!shown.length){ $('table').innerHTML = '<div class="empty"><b>No games found</b>Try a different spelling or clear the filters.</div>'; return; }

    let h = '<div class="ghead" role="row"><div role="columnheader">Game</div><div role="columnheader">Est. start</div><div role="columnheader">Category</div><div role="columnheader">Team 1</div><div role="columnheader">Team 2</div><div role="columnheader">Status</div><div role="columnheader" style="text-align:right">Score</div></div>';
    const brk = sched.break;
    shown.forEach(g => {
      if (!filtered && brk && brk.beforeNo === g.no) h += `<div class="brk"><span>Break · ${fmtMin(brk.atMin)} – ${fmtMin(brk.atMin + brk.minutes)}</span></div>`;
      const st = status[g.no] || {}, s = st.s || 'upcoming';
      const label = { upcoming:'Upcoming', called:'Called', playing:'Playing', done:'Done' }[s] || 'Upcoming';
      let when = '';
      if (s === 'playing' && st.st) when = 'Started ' + fmtMs(st.st);
      else if (s === 'done') when = (st.st ? fmtMs(st.st) : '') + (st.st && st.en ? ' – ' : '') + (st.en ? fmtMs(st.en) : '');
      const sc = s === 'done' && st.a != null && st.b != null ? `${esc(st.a)} – ${esc(st.b)}` : '';
      const w1 = s === 'done' && st.w === 'team1', w2 = s === 'done' && st.w === 'team2';
      h += `<div class="grow ${s}" role="row">
        <div class="gno" data-c="g" role="cell">${hl(g.no, toks)}</div>
        <div class="est" data-c="e" role="cell">${fmtMin(g.startMin)}<small>est.</small></div>
        <div class="cat" data-c="c" role="cell">${esc(g.cat)}</div>
        <div class="tm ${w1 ? 'win' : ''}" data-c="a" role="cell">${(g.t1 || []).map(n => hl(n, toks)).join(' &amp; ')}</div>
        <div class="tm ${w2 ? 'win' : ''}" data-c="b" role="cell">${(g.t2 || []).map(n => hl(n, toks)).join(' &amp; ')}</div>
        <div class="st" data-c="s" role="cell"><span class="badge ${s}">${label}</span>${when ? `<span class="when">${when}</span>` : ''}</div>
        <div class="wh" data-c="w" role="cell">${when}</div>
        <div class="score ${sc ? '' : 'none'}" data-c="sc" role="cell">${sc || '–'}</div></div>`;
    });
    $('table').innerHTML = h;
    const u = sched.updatedAtMs ? 'Schedule updated ' + new Date(sched.updatedAtMs).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) + '. Start times are estimates.' : 'Start times are estimates.';
    $('upd').textContent = u;
  }

  /* ---------- controls ---------- */
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return; const c = b.dataset.cat;
    if (!c) selCats.clear(); else if (selCats.has(c)) selCats.delete(c); else selCats.add(c);
    render();
  });
  let qT = null;
  $('q').addEventListener('input', e => { query = e.target.value; $('searchBox').classList.toggle('has', !!query); clearTimeout(qT); qT = setTimeout(render, 120); });
  $('qClear').addEventListener('click', () => { $('q').value = ''; query = ''; $('searchBox').classList.remove('has'); render(); $('q').focus(); });
  $('clearAll').addEventListener('click', () => { $('q').value = ''; query = ''; $('searchBox').classList.remove('has'); selCats.clear(); render(); });

  init();
})();
</script>
</body>
</html>
