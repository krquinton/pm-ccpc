<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f332e">
<title>Scoreboard · PickleManage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#262a26; --muted:#667066; --line:#e3e5e2; --bg:#f4f5f3; --card:#ffffff; --soft:#f7f8f6;
    --green:#3f8f22; --green-soft:#e6f3df; --blue:#1f7fb8;
    --dark:#2f332e; --dark2:#222622; --hl:#fff0a8; --pos:#1f6f0f; --neg:#b3261e;
    --gold:#c99a12; --silver:#8f98a3; --bronze:#b3703a;
    --shadow:0 1px 2px rgba(30,40,30,.06), 0 6px 18px rgba(30,40,30,.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.4;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  header.top{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:22px clamp(16px,4vw,40px) 20px;}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand img{width:46px;height:46px;border-radius:10px;flex:none;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .brand h1{margin:0;font-family:'Baloo 2',sans-serif;font-size:clamp(20px,4.4vw,30px);line-height:1.05;font-weight:800;overflow-wrap:anywhere;}
  .brand .sub{font-size:13.5px;color:#c9d3c9;margin-top:2px;}
  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c9d3c9;font-weight:500;}
  .dot{width:9px;height:9px;border-radius:50%;background:#6cc144;box-shadow:0 0 0 0 rgba(108,193,68,.7);animation:pulse 2s infinite;}
  .dot.off{background:#d98a2b;animation:none;}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(108,193,68,0);}100%{box-shadow:0 0 0 0 rgba(108,193,68,0);}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none;}}

  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,24px);}
  .tabs{display:flex;gap:6px;margin-top:16px;}
  .tab{padding:8px 18px;border-radius:10px;font:600 14px 'Inter',sans-serif;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);}
  .tab.on{background:var(--green);border-color:var(--green);color:#fff;}
  .events{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .ev{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer;}
  .ev[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark);}

  .tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin-top:6px;}
  .search{position:relative;}
  .search input{width:100%;font:500 16px 'Inter',sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 42px;box-shadow:var(--shadow);}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px;display:none;}
  .search.has button{display:block;}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 13px;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap;}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;}
  .chip .n{opacity:.7;font-weight:500;margin-left:4px;}
  .resline{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px;min-height:20px;}
  .resline button{background:none;border:none;color:var(--blue);font:600 12.5px 'Inter',sans-serif;cursor:pointer;padding:2px 4px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px;margin:8px 0 24px;align-items:start;}
  @media (max-width:520px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .card-h{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .card-h h2{margin:0;font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;}
  .card-h .meta{font-size:12.5px;color:var(--muted);font-weight:500;}
  .prog{height:4px;background:var(--line);margin:0 16px 6px;border-radius:4px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--green);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--soft);}
  td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  th:first-child,td:first-child{text-align:center;width:46px;padding-left:12px;}
  th.nm,td.nm{text-align:left;}
  td.nm{font-weight:600;overflow-wrap:anywhere;}
  th:last-child,td:last-child{padding-right:16px;}
  td.w{font-weight:700;}
  .rk{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;font-weight:700;font-size:13px;color:var(--muted);}
  .rk.r1{background:var(--gold);color:#fff;} .rk.r2{background:var(--silver);color:#fff;} .rk.r3{background:var(--bronze);color:#fff;}
  .pos{color:var(--pos);font-weight:600;} .neg{color:var(--neg);font-weight:600;}
  tr.top1 td.nm{font-size:15px;}
  mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px;}
  .none{padding:22px 16px;text-align:center;color:var(--muted);font-size:13.5px;}
  .empty{text-align:center;color:var(--muted);padding:44px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px;margin-top:10px;}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;padding:8px 16px 30px;}
  .foot .u{display:block;margin-top:3px;font-size:11.5px;}
  .legend{font-size:12px;color:var(--muted);margin:2px 0 0;}
  @media (max-width:520px){ .hide-s{display:none;} td,th{padding-left:6px;padding-right:6px;} }
</style>
</head>

    if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length:n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }
  function tokMatch(q, t){
    if (t.startsWith(q)) return true;
    if (q.length >= 3 && t.includes(q)) return true;
    const tol = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0; if (!tol) return false;
    return lev(q, t.slice(0, q.length)) <= tol || lev(q, t) <= tol;
  }
  const nameMatches = (name, toks) => { if (!toks.length) return true; const ws = words(name); return toks.every(q => ws.some(t => tokMatch(q, t))); };
  function hl(text, toks){
    const s = String(text || ''); if (!toks.length) return esc(s);
    return s.split(/([A-Za-z0-9\u00C0-\u024F]+)/).map((p, i) => (i % 2 && toks.some(q => tokMatch(q, fold(p)))) ? `<mark>${esc(p)}</mark>` : esc(p)).join('');
  }

  /* ---------- load ---------- */
  const urlId = new URLSearchParams(location.search).get('e');
  function setLive(ok, txt){ $('liveDot').classList.toggle('off', !ok); $('liveTxt').textContent = txt; }
  function fail(err){
    setLive(false, 'Offline'); $('evSub').textContent = '';
    $('board').innerHTML = `<div class="empty"><b>The scoreboard isn’t available right now</b>${err && err.code === 'permission-denied' ? 'It hasn’t been published yet.' : 'Check your connection and try again.'}</div>`;
  }
  async function init(){
    try {
      const snap = await db.collection('pkl-public-schedules').orderBy('updatedAtMs', 'desc').limit(30).get();
      events = snap.docs.map(d => ({ id:d.id, title:(d.data().eventName || 'Event'), date:d.data().dateText || '' }));
    } catch (err) { events = []; if (!urlId) return fail(err); }
    if (!events.length && !urlId){ setLive(false, 'Not published yet'); $('evSub').textContent = ''; $('board').innerHTML = '<div class="empty"><b>No scoreboard has been published yet</b>Check back soon.</div>'; return; }
    renderEvents(); open(urlId || events[0].id);
  }
  function renderEvents(){
    const box = $('events'); if (events.length < 2){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = events.map(e => `<button class="ev" data-id="${esc(e.id)}" aria-pressed="${e.id === curId}">${esc(e.title)}${e.date ? ' · ' + esc(e.date) : ''}</button>`).join('');
  }
  $('events').addEventListener('click', e => { const b = e.target.closest('.ev'); if (b) open(b.dataset.id); });

  function open(id){
    unsubs.forEach(u => u()); unsubs = [];
    curId = id; sched = null; board = null; status = {}; selCats.clear(); renderEvents();
    $('tabSched').href = 'schedule.html?e=' + encodeURIComponent(id);
    try { history.replaceState(null, '', '?e=' + encodeURIComponent(id)); } catch(e){}
    unsubs.push(db.collection('pkl-public-schedules').doc(id).onSnapshot(s => {
      if (!s.exists){ sched = null; $('tools').hidden = true; $('board').innerHTML = '<div class="empty"><b>This scoreboard isn’t published</b>Check the link or ask the organizers.</div>'; setLive(false, 'Not found'); return; }
      sched = s.data(); setLive(true, 'Live'); render();
    }, fail));
    unsubs.push(db.collection('pkl-public-board').doc(id).onSnapshot(s => { board = s.exists ? s.data() : null; render(); }, () => {}));
    unsubs.push(db.collection('pkl-public-status').doc(id).onSnapshot(s => { status = s.exists ? (s.data().games || {}) : {}; render(); }, () => {}));
  }

  /* ---------- render ---------- */
  function groups(){
    const out = ((board && board.groups) || []).map(g => ({ name:g.name, kind:g.kind || 'Player', rows:g.rows || [] }));
    const have = new Set(out.map(g => g.name));
    ((sched && sched.games) || []).forEach(g => { if (!have.has(g.cat)){ have.add(g.cat); out.push({ name:g.cat, kind:'Team', rows:[] }); } });
    return out;
  }
  function progress(cat){
    const gs = ((sched && sched.games) || []).filter(g => g.cat === cat); if (!gs.length) return null;
    const done = gs.filter(g => status[g.no] && status[g.no].s === 'done').length;
    return { done, total: gs.length };
  }
  function render(){
    if (!sched) return;
    document.title = (sched.eventName || 'Scoreboard') + ' · Scoreboard';
    $('evTitle').textContent = sched.eventName || 'Scoreboard';
    $('brandImg').src = sched.logo || DEFAULT_LOGO;
    $('evSub').textContent = [sched.dateText, sched.venue].filter(Boolean).join(' · ');
    const all = groups();
    $('tools').hidden = !all.length; $('legend').hidden = !all.length;
    [...selCats].forEach(c => { if (!all.some(g => g.name === c)) selCats.delete(c); });
    $('chips').innerHTML = `<button class="chip" data-cat="" aria-pressed="${selCats.size === 0}">All<span class="n">${all.length}</span></button>` +
      all.map(g => `<button class="chip" data-cat="${esc(g.name)}" aria-pressed="${selCats.has(g.name)}">${esc(g.name)}</button>`).join('');
    const toks = words(query), filtered = toks.length > 0 || selCats.size > 0;
    const shown = all.filter(g => !selCats.size || selCats.has(g.name)).map(g => ({ ...g, view: g.rows.filter(r => nameMatches(r.n, toks)) })).filter(g => !toks.length || g.view.length);
    $('resTxt').textContent = filtered ? `${shown.length} of ${all.length} categories` : '';
    $('clearAll').hidden = !filtered;
    if (!all.length){ $('board').innerHTML = '<div class="empty"><b>No categories yet</b>Results will appear here once games are played.</div>'; return; }
    if (!shown.length){ $('board').innerHTML = '<div class="empty"><b>No one found</b>Try a different spelling or clear the filters.</div>'; return; }
    $('board').innerHTML = '<div class="grid">' + shown.map(g => {
      const pg = progress(g.name), noun = g.kind.toLowerCase() + (g.rows.length === 1 ? '' : 's');
      const body = g.view.length ? g.view.map(r => `<tr class="${r.r === 1 ? 'top1' : ''}"><td><span class="rk ${r.r <= 3 ? 'r' + r.r : ''}">${esc(r.r)}</span></td><td class="nm">${hl(r.n, toks)}</td><td class="hide-s">${esc(r.gp)}</td><td class="w">${esc(r.w)}</td><td>${esc(r.l)}</td><td class="hide-s">${esc(r.pf)}</td><td class="${r.pd > 0 ? 'pos' : r.pd < 0 ? 'neg' : ''}">${r.pd > 0 ? '+' : ''}${esc(r.pd)}</td></tr>`).join('') : '';
      return `<section class="card"><div class="card-h"><h2>${esc(g.name)}</h2><span class="meta">${g.rows.length ? g.rows.length + ' ' + noun : 'No results yet'}${pg ? ' · ' + pg.done + '/' + pg.total + ' games' : ''}</span></div>
        ${pg ? `<div class="prog" aria-hidden="true"><i style="width:${Math.round(pg.done / pg.total * 100)}%"></i></div>` : ''}
        ${g.view.length ? `<table><thead><tr><th>#</th><th class="nm">${esc(g.kind)}</th><th class="hide-s">GP</th><th>W</th><th>L</th><th class="hide-s">PF</th><th>+/-</th></tr></thead><tbody>${body}</tbody></table>` : '<div class="none">Standings will show after the first game is finished.</div>'}</section>`;
    }).join('') + '</div>';
    const when = (board && board.updatedAtMs) || sched.updatedAtMs;
    $('upd').textContent = when ? 'Updated ' + new Date(when).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) + '.' : '';
  }

  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return; const c = b.dataset.cat;
    if (!c) selCats.clear(); else if (selCats.has(c)) selCats.delete(c); else selCats.add(c);
    render();
  });
  let qT = null;
  $('q').addEventListener('input', e => { query = e.target.value; $('searchBox').classList.toggle('has', !!query); clearTimeout(qT); qT = setTimeout(render, 120); });
  $('qClear').addEventListener('click', () => { $('q').value = ''; query = ''; $('searchBox').classList.remove('has'); render(); $('q').focus(); });
  $('clearAll').addEventListener('click', () => { $('q').value = ''; query = ''; $('searchBox').classList.remove('has'); selCats.clear(); render(); });

  init();
})();
</script>
</body>
</html>
