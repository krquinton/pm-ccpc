<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickleManage — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#141714;--sf:#1e231e;--in:#191d19;--t:#eef1ec;--m:#9aa49a;--bd:#2f372f;--a:#6cc144;--at:#10210a;--chip:#2a312a;--c1:#3992b9;--c2:#ff6600;--sh:0 10px 30px rgba(0,0,0,.45)}
html[data-theme="light"]{--bg:#ececec;--sf:#fff;--in:#f4f5f2;--t:#262a26;--m:#6a706a;--bd:#dcdddb;--a:#4f9d2d;--at:#fff;--chip:#fff;--sh:0 8px 24px rgba(38,42,38,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
h1,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
#o{flex:1;min-height:0;display:flex;flex-direction:column}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:1vh 1.2vw;box-shadow:var(--sh)}
.s{color:var(--m)}

/* ---------- header / scoreboard ---------- */
header.top{display:block;text-align:center;padding:8px 2.5vw 22px;flex:none;color:#fff;position:relative;
  background:linear-gradient(135deg,#2f332e 0%,#222622 100%);box-shadow:var(--sh)}
header.top h1{font-size:clamp(20px,3vw,44px);color:#fff;line-height:1.05;font-weight:800}
header.top .sub{color:#6cc144;font-weight:700;font-size:clamp(11px,1.3vw,20px);margin-top:2px}
header.top .logo{position:absolute;left:1.5vw;top:8px;height:clamp(34px,7vh,70px);border-radius:8px}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;margin-top:2px;position:relative;z-index:1}
.tm{display:flex;align-items:center;gap:1vw;min-width:0}
.tm.r{flex-direction:row-reverse;text-align:right}
.tm b{font:800 clamp(18px,2.6vw,40px)/1.05 'Baloo 2',sans-serif;border-bottom:4px solid;padding-bottom:2px;overflow-wrap:anywhere}
.n{font:800 clamp(52px,10vh,130px)/.9 'Baloo 2',sans-serif;white-space:nowrap}
.n em{font-style:normal;opacity:.5;padding:0 .1em}
.tug{position:relative;height:clamp(22px,3.4vh,40px);background:#fff;border-radius:99px;margin:8px 0 0;z-index:1}
.tug i{position:absolute;top:0;bottom:0;transition:width .8s}
.f1{left:0;border-radius:99px 0 0 99px;background:var(--c1)}
.f2{right:0;border-radius:0 99px 99px 0;background:var(--c2)}
.lead{margin-top:clamp(12px,2vh,22px);font:700 clamp(14px,1.8vw,26px) 'Baloo 2',sans-serif;color:#cfe9c3;position:relative;z-index:1}

/* ---------- courts ---------- */
.main{flex:1;min-height:0;display:grid;gap:12px;padding:12px 1.5vw;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.main.q{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)}
.main.st{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.main.st.noq{grid-template-columns:minmax(0,1fr)}
.col{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.ct{margin:0;display:flex;flex-direction:column;justify-content:center;gap:1vh;min-height:0;overflow:hidden;font-size:clamp(15px,2vw,38px)}
.ct.on{border-color:var(--a);border-width:2px}
.ct h3{font-size:.7em;color:var(--m);display:flex;justify-content:space-between;align-items:center;gap:.6em}
.ct .cat{font-size:.5em;color:var(--m)}
.ct .t{padding:.25em .5em;border-radius:10px;background:var(--in);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ct .tms{display:flex;flex-direction:column;gap:.5vh;min-width:0}
.t.tb.i1{border-left:.3em solid var(--c1)}
.t.tb.i2{border-left:.3em solid var(--c2)}
.tmr{font:800 2.2em/1 'Baloo 2',sans-serif;color:var(--a);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.main.st .tmr{font-size:1.7em}
.main.st.c3 .tmr,.main.st.c5 .tmr{font-size:1.4em}
.st{font-size:.65em;font-weight:700;color:var(--a)}
.st.wait{color:var(--m)}
.ct .open{text-align:center;color:var(--m);font-size:.9em}
.main.st .ct{padding:.6vh 1vw;gap:.4vh}
.main.st.c1 .ct{font-size:clamp(18px,2.6vw,48px)}
.main.st.c2 .ct{font-size:clamp(16px,2.2vw,42px)}
.main.st.c3 .ct{font-size:clamp(14px,1.8vw,32px)}
.main.st.c5 .ct{font-size:clamp(11px,1.4vw,24px)}
.main.st.c3 .tms,.main.st.c5 .tms{flex-direction:row}
.main.st.c3 .tms .t,.main.st.c5 .tms .t{flex:1}

/* ---------- queue ---------- */
.qu{display:flex;flex-direction:column;min-height:0;overflow:hidden;font-size:clamp(14px,1.65vw,32px);margin:0}
.qu h3{margin:0 0 .3em;font-size:1.15em;display:flex;justify-content:space-between;align-items:center}
.qu .cnt{background:var(--a);color:var(--at);border-radius:99px;padding:0 .5em;font-size:.7em}
.ql{flex:1;min-height:0;overflow:hidden;position:relative}
.it{background:var(--in);border:1px solid var(--bd);border-radius:10px;margin:0 0 .25em;padding:.2em .5em;display:flex;align-items:center;gap:.6em}
.qb{flex:1;min-width:0}
.qh{font-size:.5em;color:var(--m);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{background:var(--chip);border:1px solid var(--bd);border-radius:99px;min-width:1.8em;text-align:center;font-weight:700;color:var(--t)}
.qt{font-weight:700;line-height:1.12;padding:0 .4em;margin:.05em 0;overflow-wrap:anywhere}
.qt.tb.i1{border-left:.25em solid var(--c1)}
.qt.tb.i2{border-left:.25em solid var(--c2)}

/* ---------- popups ---------- */
.ov{position:fixed;inset:0;background:rgba(10,13,10,.88);display:none;align-items:center;justify-content:center;z-index:80;padding:3vh 3vw}
.ov.show{display:flex}
.ov.lb{z-index:70;flex-direction:column}
.pop{background:var(--sf);border:3px solid var(--a);border-radius:28px;padding:clamp(30px,4vw,60px) clamp(40px,6vw,90px);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);max-width:92vw}
.pop .k{font:800 min(5vh,3vw) 'Baloo 2',sans-serif;color:var(--a);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.pop .cb{font-size:min(4.6vh,2.8vw);color:var(--m);margin-bottom:18px;font-weight:600}
.pop .tb2{font:800 min(8.5vh,5.4vw)/1.25 'Baloo 2',sans-serif}
.pop .sb{font:800 min(13vh,8vw) 'Baloo 2',sans-serif;color:var(--a);margin-top:14px}
.pop .wn{font:800 min(10vh,6vw) 'Baloo 2',sans-serif;color:#3ecb7c;margin-top:6px}
.lb-title{font:800 min(7vh,4.2vw) 'Baloo 2',sans-serif;color:var(--a);text-transform:uppercase;letter-spacing:.12em;line-height:1;margin-bottom:.8vh;text-align:center}
.lb-sub{font:700 min(3vh,1.8vw) 'Baloo 2',sans-serif;color:var(--m);margin-bottom:3vh;text-align:center}
.lb-cols{display:grid;gap:2vw;width:100%;flex:1;min-height:0}
.lb-col{background:var(--sf);border:.4vh solid var(--bd);border-radius:2vh;padding:2vh 1.6vw;display:flex;flex-direction:column;min-width:0}
.lb-col h3{margin:0 0 1.6vh;font-size:min(5vh,2.8vw);color:var(--a);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row{display:flex;align-items:center;gap:1vw;flex:1;min-height:0;border-top:.2vh solid var(--bd)}
.lb-row:first-of-type{border-top:none}
.lb-rank{font:800 min(6vh,3.4vw) 'Baloo 2',sans-serif;color:var(--a);width:3.4vw;text-align:center;flex-shrink:0}
.lb-name{flex:1;min-width:0;font:800 min(4.8vh,2.7vw) 'Baloo 2',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stat{font:800 min(3.4vh,1.9vw)/1.1 'Baloo 2',sans-serif;color:var(--m);text-align:right;flex-shrink:0}
.lb-stat b{color:var(--t);font-size:1.25em}
.lb-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--m);font:700 min(4vh,2.2vw) 'Baloo 2',sans-serif}

/* theme switch */
.tg{position:fixed;right:8px;top:8px;width:40px;height:22px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:14px;cursor:pointer;z-index:90;opacity:.6}
.tg .kn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#6cc144;transition:transform .2s;font-size:9px;display:flex;align-items:center;justify-content:center}
html[data-theme="light"] .tg .kn{transform:translateX(18px);background:#3992b9}

@media(max-width:800px){
  body{overflow:auto}html,body{height:auto}
  .main,.main.q,.main.st{grid-template-columns:1fr}
  .col{grid-template-rows:none}
  .sc{grid-template-columns:1fr}
  .tm,.tm.r{flex-direction:row;justify-content:center;text-align:left}
}
</style>
</head>
<body>
<div id="o"></div>
<div class="tg" id="tg" title="Light / dark"><div class="kn" id="tk">🌙</div></div>

<div class="ov lb" id="lbOv"><div class="lb-title">🏆 Leaderboard</div><div class="lb-sub" id="lbSub"></div><div class="lb-cols" id="lbCols"></div></div>
<div class="ov" id="callOv"><div class="pop"><div class="k">📣 Calling players</div><div class="cb" id="callCourt"></div><div class="tb2" id="callTeams"></div></div></div>
<div class="ov" id="winOv"><div class="pop"><div class="k">🏆 Match result</div><div class="cb" id="winCourt"></div><div class="tb2" id="winTeams"></div><div class="sb" id="winScore"></div><div class="wn" id="winName"></div></div></div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyB4IiCCQHtGeIT44n71oGlKk7PIOSWxfg8",
  authDomain: "ccpc-1943f.firebaseapp.com",
  databaseURL: "https://ccpc-1943f-default-rtdb.firebaseio.com",
  projectId: "ccpc-1943f",
  storageBucket: "ccpc-1943f.firebasestorage.app",
  messagingSenderId: "904942754236",
  appId: "1:904942754236:web:aecbec51d5cd0b745b33b9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm = a => (a || []).map(p => esc(p.name)).join(' &amp; ');
const fmt = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60, p = n => String(n).padStart(2,'0'); return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`; };

function theme(t){ document.documentElement.setAttribute('data-theme', t); $('#tk').textContent = t === 'light' ? '☀️' : '🌙'; localStorage.setItem('pkl-tv-theme', t); }
theme(localStorage.getItem('pkl-tv-theme') || 'dark');
$('#tg').addEventListener('click', () => theme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));

/* ================= live data ================= */
let ms = [], bk = {}, ses = {}, ds = {};
let COURTS = Number(localStorage.getItem('pkl-tv-courts')) || 4;
if (COURTS < 1 || COURTS > 5) COURTS = 4;

db.collection('pkl-queue-matches').onSnapshot(snap => {
  ms = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.order || 0) - (b.order || 0));
  R();
}, err => console.error(err));
db.collection('pkl-queue-buckets').onSnapshot(snap => {
  bk = {}; snap.docs.forEach(d => { bk[d.id] = d.data().name || ''; });
  R();
}, err => console.error(err));
db.collection('pkl-queue-session').doc('state').onSnapshot(doc => {
  ses = doc.exists ? doc.data() : {};
  const cc = Number(ses.courtCount), n = (cc >= 1 && cc <= 5) ? Math.floor(cc) : 4;
  if (n !== COURTS) { COURTS = n; localStorage.setItem('pkl-tv-courts', String(n)); }
  R();
}, err => console.error(err));
/* The admin app publishes the meet score (and the show-queue / leaderboard switches) here */
db.collection('pkl-queue-events').doc('displaySettings').onSnapshot(doc => {
  ds = doc.exists ? doc.data() : {};
  R(); renderLB();
}, err => console.error(err));

/* ================= render ================= */
function R(){
  const bt = ds.battle || null, n = COURTS, showQ = ds.showQueue !== false;
  const isB = m => !!bt && m.bucket === bt.bucket;
  const on = ms.filter(m => m.status === 'playing' || m.status === 'assigned');
  const q = ms.filter(m => m.status === 'waiting' || m.status === 'onhold');
  const sessionName = ses.currentSessionName || '';

  let head;
  if (bt) {
    const p1 = Number(bt.p1) || 0, p2 = Number(bt.p2) || 0;
    const live = ms.filter(isB).length + p1 + p2;
    const N = Math.max(Number(bt.total) || 0, live), W = Math.floor(N / 2) + 1;
    const fin = N && (p1 >= W || p2 >= W);
    const allDone = N && p1 + p2 >= N;
    const lead = !N ? 'Waiting for matches'
      : fin ? `${esc(p1 >= W ? bt.name1 : bt.name2)} wins the meet!`
      : (allDone && p1 === p2) ? 'The meet ends in a tie'
      : p1 === p2 ? `Tied · ${W} points to win`
      : `${esc(p1 > p2 ? bt.name1 : bt.name2)} leads by ${Math.abs(p1 - p2)} · ${W} points to win`;
    head = `<h1>Dual Meet: ${esc(bt.name1)} vs ${esc(bt.name2)}</h1>${sessionName ? `<div class="sub">${esc(sessionName)}</div>` : ''}
      <div class="sc"><div class="tm"><b style="border-color:var(--c1)">${esc(bt.name1)}</b></div>
        <div class="n"><span style="color:var(--c1)">${p1}</span><em>:</em><span style="color:var(--c2)">${p2}</span></div>
        <div class="tm r"><b style="border-color:var(--c2)">${esc(bt.name2)}</b></div></div>
      <div class="tug"><i class="f1" style="width:${N ? p1 / N * 100 : 0}%"></i><i class="f2" style="width:${N ? p2 / N * 100 : 0}%"></i></div>
      <div class="lead">${lead}</div>`;
    document.title = `${bt.name1} vs ${bt.name2} — PickleManage`;
  } else {
    head = `<h1>PickleManage</h1>${sessionName ? `<div class="sub">${esc(sessionName)}</div>` : ''}`;
    document.title = sessionName ? sessionName + ' — PickleManage' : 'PickleManage';
  }

  const court = c => {
    const m = on.find(x => x.court === c);
    const st = !m ? '' : m.status === 'playing'
      ? `<span class="st">Playing</span>`
      : `<span class="st wait">Waiting to start</span>`;
    const tb = m && isB(m) ? ' tb' : '';
    return `<div class="card ct${m ? ' on' : ''}"><h3>Court ${c}${st}</h3>${m
      ? `<div class="cat">${esc(bk[m.bucket] || '')}</div><div class="tms"><div class="t i1${tb}">${nm(m.team1)}</div><div class="t i2${tb}">${nm(m.team2)}</div></div>${m.status === 'playing' ? `<div class="tmr" data-s="${Number(m.startedAt) || ''}">00:00</div>` : ''}`
      : '<div class="open">Open</div>'}</div>`;
  };
  const queue = showQ ? `<div class="card qu"><h3>Up next <span class="cnt">${q.length}</span></h3><div class="ql" id="ql">${q.map((m, k) => {
      const tb = isB(m) ? ' tb' : '';
      return `<div class="it"><span class="pos">${k + 1}</span><div class="qb"><div class="qh">${esc(bk[m.bucket] || '')}${m.status === 'onhold' ? ' · ON HOLD' : ''}</div><div class="qt i1${tb}">${nm(m.team1)}</div><div class="qt i2${tb}">${nm(m.team2)}</div></div></div>`;
    }).join('') || '<div class="s">Queue is empty</div>'}</div></div>` : '';

  const body = n === 4
    ? `<div class="main${showQ ? ' q' : ''}"><div class="col">${court(1)}${court(2)}</div>${queue}<div class="col">${court(3)}${court(4)}</div></div>`
    : `<div class="main st c${n}${showQ ? '' : ' noq'}"><div class="col" style="grid-template-rows:repeat(${n},minmax(0,1fr))">${Array.from({ length:n }, (_, i) => court(i + 1)).join('')}</div>${queue}</div>`;

  $('#o').innerHTML = `<header class="top"><img class="logo" alt="" src="pklbox-logo.png" onerror="this.style.display='none'">${head}</header>${body}`;
  fitQ(); tick();
}
function tick(){ document.querySelectorAll('[data-s]').forEach(e => { const s = Number(e.dataset.s); if (s) e.textContent = fmt((Date.now() - s) / 1000); }); }
setInterval(tick, 1000);
/* the queue shows as many items as fit; the rest are hidden */
function fitQ(){
  const l = document.getElementById('ql'); if (!l) return;
  const kids = [...l.children]; kids.forEach(k => k.style.display = '');
  const H = l.clientHeight;
  kids.forEach(k => { if (k.offsetTop + k.offsetHeight > H + 1) k.style.display = 'none'; });
}
addEventListener('resize', fitQ);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitQ);

/* ================= leaderboard popup (admin: "Show leaderboard") ================= */
function renderLB(){
  const ov = $('#lbOv'), lb = ds.leaderboard;
  if (!lb || !lb.show) { ov.classList.remove('show'); return; }
  const buckets = (lb.buckets || []).slice(0, 3);
  $('#lbSub').textContent = (lb.sessionName ? lb.sessionName + ' · ' : '') + 'Top 5 per category';
  const cols = $('#lbCols');
  cols.style.gridTemplateColumns = `repeat(${Math.max(1, buckets.length)}, 1fr)`;
  cols.innerHTML = buckets.map(b => `<div class="lb-col"><h3>${esc(b.name)}</h3>${(b.rows && b.rows.length)
    ? b.rows.map(r => `<div class="lb-row"><div class="lb-rank">${r.rank}</div><div class="lb-name">${esc(r.name)}</div><div class="lb-stat"><b>${r.w}</b> W<br>${r.pf} pts</div></div>`).join('')
    : '<div class="lb-empty">No results yet</div>'}</div>`).join('');
  ov.classList.add('show');
}

/* ================= call / winner popups ================= */
let evReady = false, lastEv = null;
db.collection('pkl-queue-events').orderBy('createdAt', 'desc').limit(1).onSnapshot(snap => {
  if (snap.empty) { evReady = true; return; }
  const doc = snap.docs[0], d = doc.data();
  if (!d.createdAt) return;                       // server timestamp still pending
  if (!evReady) { evReady = true; lastEv = doc.id; return; }
  if (doc.id === lastEv) return;
  lastEv = doc.id;
  if (Date.now() - d.createdAt.toMillis() > 15000) return;
  if (d.type === 'call') {
    $('#callCourt').textContent = `Court ${d.court}`;
    $('#callTeams').innerHTML = `${esc(d.team1.join(' & '))}<br><span style="color:var(--m);font-size:.6em;">vs</span><br>${esc(d.team2.join(' & '))}`;
    const ov = $('#callOv'); ov.classList.add('show'); setTimeout(() => ov.classList.remove('show'), 5000);
  } else if (d.type === 'winner') {
    const t1 = d.team1.join(' & '), t2 = d.team2.join(' & ');
    $('#winCourt').textContent = `Court ${d.court}`;
    $('#winTeams').innerHTML = `${esc(t1)} <span style="color:var(--m);font-size:.5em;">vs</span> ${esc(t2)}`;
    $('#winScore').textContent = `${d.score1} – ${d.score2}`;
    $('#winName').textContent = d.winner === 'team1' ? t1 : t2;
    const ov = $('#winOv'); ov.classList.add('show'); setTimeout(() => ov.classList.remove('show'), 5000);
  }
}, err => console.error(err));

R();
</script>
</body>
</html>
