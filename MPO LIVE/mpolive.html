<!DOCTYPE html>
<!-- mpolive.html: MPO Cup livestream screen (screen-share this browser tab).
     Views: 1 Countdown · 2 Sponsors · 3 Pool Draw · 4 Schedule · 5 Game Format · 6 Outro.
     Switch with the icons (bottom, show on mouse move), keys 1-6, or from mpolive-setup.html. Last one pressed wins.
     F or double-click = fullscreen. Data: Firebase RTDB mindoropickleballorg, path mpolive/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPO LIVE · Mindoro Pickleball Org. Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F3F1E8;--dim:#A9C3B6;--forest:#0F3B2E;--card:#F6F4EC;--ball:#D7F03C;--clay:#E27A5C;--ink:#0B1D17}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
  background:linear-gradient(180deg,#06120E 0%,#0B1D17 48%,#15342A 66%,#0B1D17 100%);font-family:Archivo,system-ui,sans-serif;color:var(--cream)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 900px 420px at 50% 56%,rgba(227,164,95,.18),rgba(227,164,95,0) 72%)}
#land{position:absolute;left:0;top:660px;width:1920px;height:420px;display:block;pointer-events:none}
#frame{position:absolute;inset:0;width:1920px;height:1080px;display:block;pointer-events:none}

.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.view.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0B1D17}
.wrap{position:absolute;left:120px;right:120px;top:84px;bottom:150px;display:flex;flex-direction:column;align-items:center;text-align:center}

.eb{font-weight:700;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.eb b{color:var(--ball);font-weight:700}
h1.ttl{font-weight:800;font-stretch:108%;font-size:72px;line-height:1.04;margin-top:14px}
.orn{margin-top:22px}

/* countdown */
#cdWrap{justify-content:center;gap:0}
#cdText{font-weight:800;font-stretch:105%;font-size:64px;line-height:1.1;max-width:1500px;margin-top:22px}
#cdClock{display:flex;align-items:flex-start;gap:28px;margin-top:56px}
.cdU{display:flex;flex-direction:column;align-items:center;gap:14px}
.cdN{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:250px;line-height:.9;color:var(--ball);background:rgba(6,18,14,.7);border:2px solid rgba(243,241,232,.16);border-radius:36px;padding:28px 40px 34px;min-width:420px;font-variant-numeric:tabular-nums;box-shadow:0 36px 70px rgba(0,0,0,.45)}
.cdL{font-weight:700;font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.cdC{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:190px;line-height:1.25;color:rgba(243,241,232,.35)}
#cdClock.tick .cdC{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#cdDone{display:none;font-weight:900;font-stretch:112%;font-size:150px;line-height:1;text-transform:uppercase;color:var(--ball);margin-top:60px;max-width:1600px}
#cdWrap.done #cdClock,#cdWrap.done #cdText{display:none}
#cdWrap.done #cdDone{display:block;animation:pop 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#cdWrap.done .pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* schedule */
#schList{margin-top:44px;width:100%;max-width:1560px;display:flex;flex-direction:column;gap:28px;transform-origin:50% 0}
.day{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:stretch;text-align:left}
.dayL{background:var(--forest);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;box-shadow:0 0 0 2px rgba(243,241,232,.14)}
.dayL .m{font-weight:700;font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.dayL .d{font-weight:900;font-stretch:112%;font-size:92px;line-height:1;color:var(--ball)}
.dayL .x{font-weight:800;font-size:44px;line-height:1.1;color:var(--cream);text-align:center}
.rows{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:190px 1fr auto;align-items:center;gap:26px;background:var(--card);color:var(--ink);border-radius:20px;padding:22px 30px;box-shadow:0 20px 44px rgba(0,0,0,.4)}
.row .t{font-weight:900;font-stretch:110%;font-size:44px;line-height:1;color:var(--forest)}
.row .n{font-weight:800;font-size:40px;line-height:1.1}
.chip{font-family:Inter,sans-serif;font-weight:700;font-size:20px;padding:10px 20px;border-radius:999px;background:var(--forest);color:var(--ball);white-space:nowrap}
.chip:empty{display:none}

/* format */
#fmtList{margin-top:48px;width:100%;display:grid;gap:28px;transform-origin:50% 0}
.fc{background:var(--card);color:var(--ink);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(0,0,0,.45);text-align:left}
.fh{background:var(--forest);color:var(--cream);padding:22px 28px;display:flex;align-items:center;gap:14px}
.fh .no{font-weight:900;font-stretch:115%;font-size:40px;color:var(--ball);line-height:1}
.fh .s{font-weight:800;font-size:34px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
.fb{padding:22px 28px 26px;display:flex;flex-direction:column;gap:16px;flex:1}
.fl{display:flex;flex-direction:column;gap:4px;border-bottom:1.5px dashed #CFCAB9;padding-bottom:14px}
.fl span{font-family:Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6F7E74}
.fl b{font-weight:800;font-size:34px;line-height:1.1}
.fa{margin-top:auto;align-self:flex-start;font-weight:800;font-size:24px;padding:10px 20px;border-radius:12px;background:var(--ball);color:var(--ink)}
.fa:empty{display:none}

/* outro */
.ou{position:absolute;left:140px;right:140px;top:80px;bottom:140px;display:grid;grid-template-columns:520px 1fr;gap:80px;align-items:center}
.ou .lc{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:40px;background:var(--forest);box-shadow:0 0 0 2px rgba(243,241,232,.14),0 40px 80px rgba(0,0,0,.5)}
.ou .lc img{width:70%}
.ou .tx{min-width:0}
.ou .ev{font-weight:800;font-size:40px;line-height:1.1;margin-top:12px;color:rgba(243,241,232,.85)}
.ou .see{font-weight:900;font-stretch:112%;font-size:96px;line-height:.98;text-transform:uppercase;margin-top:22px;overflow-wrap:anywhere}
.ou .see b{color:var(--ball);display:block}
.ou .dt{display:inline-block;margin-top:28px;font-weight:800;font-size:40px;color:var(--ink);background:var(--ball);padding:10px 26px;border-radius:14px}
.ou .ct{margin-top:44px;padding-top:28px;border-top:1.5px dashed rgba(243,241,232,.25);display:grid;grid-template-columns:auto 1fr;gap:10px 26px;font-family:Inter,sans-serif;font-size:26px}
.ou .ct span{font-weight:700;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);align-self:center}
.ou .ct b{font-weight:700;overflow-wrap:anywhere}
.ou [hidden]{display:none!important}

/* footer */
#footer{position:absolute;left:64px;right:64px;bottom:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);pointer-events:none;transition:opacity .5s}
#footer .ev{display:flex;align-items:center;gap:14px}
#footer .ev img{height:40px;width:auto;display:block}
#footer .live{justify-self:end;display:flex;align-items:center;gap:10px;color:var(--cream)}
#footer .live i{width:12px;height:12px;border-radius:50%;background:var(--clay);box-shadow:0 0 12px var(--clay);animation:blink 1.4s steps(2) infinite}
#stage.full #footer{opacity:0}

/* icon dock */
#dock{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:16px;background:rgba(6,18,14,.85);border:1.5px solid rgba(243,241,232,.2);z-index:50;transition:opacity .4s,transform .4s}
body.idle #dock{opacity:0;transform:translateX(-50%) translateY(16px);pointer-events:none}
#dock button{position:relative;width:46px;height:46px;border:0;border-radius:11px;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center}
#dock button svg{width:22px;height:22px;display:block}
#dock button:hover{background:rgba(243,241,232,.1);color:var(--cream)}
#dock button.on{background:var(--ball);color:var(--ink)}
#dock button:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
#dock button .tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 14px Inter,sans-serif;padding:6px 10px;border-radius:8px;background:var(--cream);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .15s}
#dock button:hover .tip,#dock button:focus-visible .tip{opacity:1}
#dock button kbd{font:inherit;opacity:.6;margin-left:6px}
#conn{position:absolute;top:36px;right:64px;font:600 15px Inter,sans-serif;color:var(--clay);z-index:40}
#conn:empty{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <svg id="land" viewBox="0 0 1920 420" aria-hidden="true">
    <path fill="#132E25" d="M0 190 C120 160 220 120 330 126 C430 132 500 90 590 70 C660 56 720 84 780 96 C860 110 900 70 960 60 C1040 50 1120 96 1200 92 C1300 88 1360 40 1440 36 C1520 32 1600 90 1700 110 C1800 130 1870 150 1920 156 L1920 420 L0 420 Z"/>
    <path fill="#1A4436" d="M0 250 C150 230 260 170 400 176 C500 180 570 130 680 112 C770 98 840 60 900 40 L960 20 L1020 44 C1100 74 1170 100 1270 108 C1400 118 1480 170 1600 182 C1720 194 1830 222 1920 216 L1920 420 L0 420 Z"/>
    <path fill="#123326" d="M0 300 C160 282 270 254 410 262 C530 268 610 222 730 210 C830 200 900 240 1000 234 C1120 226 1200 178 1330 176 C1460 174 1560 232 1700 240 C1800 246 1880 264 1920 268 L1920 420 L0 420 Z"/>
    <path fill="#0D251C" d="M0 352 C200 340 360 334 520 344 C700 354 820 322 980 318 C1160 314 1280 346 1460 344 C1640 342 1780 332 1920 338 L1920 420 L0 420 Z"/>
  </svg>
  <svg id="frame" viewBox="0 0 1920 1080" aria-hidden="true"><g fill="none" stroke="#F3F1E8" stroke-opacity=".28" stroke-width="2"><polyline points="32,76 32,32 76,32"/><polyline points="1844,32 1888,32 1888,76"/><polyline points="32,1004 32,1048 76,1048"/><polyline points="1844,1048 1888,1048 1888,1004"/></g></svg>

  <!-- 1 countdown -->
  <section class="view" id="v-countdown" aria-label="Countdown">
    <div class="wrap" id="cdWrap">
      <div class="eb pulse" id="cdEb">Live Pool Draw</div>
      <div id="cdText">Draw Assignment will commence in</div>
      <div id="cdClock" role="timer" aria-live="off">
        <div class="cdU"><div class="cdN" id="cdM">05</div><div class="cdL">Minutes</div></div>
        <div class="cdC">:</div>
        <div class="cdU"><div class="cdN" id="cdS">00</div><div class="cdL">Seconds</div></div>
      </div>
      <div id="cdDone">Draw is starting now</div>
    </div>
  </section>

  <!-- 2 sponsors (iframe, loaded on first visit) -->
  <section class="view" id="v-sponsors" aria-label="Sponsors"></section>

  <!-- 3 pool draw (iframe, loaded at start so setup sees the draw screen as connected) -->
  <section class="view" id="v-draw" aria-label="Pool draw">
    <iframe id="drawF" src="randomizer/draw.html" title="Pool draw" allow="autoplay; fullscreen"></iframe>
  </section>

  <!-- 4 schedule -->
  <section class="view" id="v-schedule" aria-label="Schedule">
    <div class="wrap">
      <div class="eb" id="schEb">Mindoro Pickleball Org. Cup 2026</div>
      <h1 class="ttl">Tournament <b style="color:var(--ball)">Schedule</b></h1>
      <div id="schList"></div>
    </div>
  </section>

  <!-- 5 game format -->
  <section class="view" id="v-format" aria-label="Game format">
    <div class="wrap">
      <div class="eb" id="fmtEb">Mindoro Pickleball Org. Cup 2026</div>
      <h1 class="ttl">Game <b style="color:var(--ball)">Format</b></h1>
      <div id="fmtList"></div>
    </div>
  </section>

  <!-- 6 outro -->
  <section class="view" id="v-outro" aria-label="Outro">
    <div class="ou">
      <div class="lc"><img src="../mpo-mark.png" alt="" onerror="this.remove()"></div>
      <div class="tx">
        <div class="eb" id="ouEb"></div><div class="ev" id="ouEv"></div>
        <div class="see" id="ouSee"></div><div class="dt" id="ouDt"></div>
        <div class="ct" id="ouCt"></div>
      </div>
    </div>
  </section>

  <div id="footer"><span class="ev"><img src="../mpo-mark.png" alt="" onerror="this.remove()"><span id="evName">Mindoro Pickleball Org. Cup 2026</span></span><span></span><span class="live"><i></i>Live</span></div>
  <div id="conn" role="status"></div>

  <nav id="dock" aria-label="Screens"></nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),pad=n=>String(n).padStart(2,'0'),
 esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- defaults (shown until setup saves something) ---------- */
const DEF={
 settings:{eventName:'Mindoro Pickleball Org. Cup 2026'},
 countdown:{eyebrow:'Live Pool Draw',text:'Draw Assignment will commence in',minutes:5,endAt:null,doneText:'Draw is starting now'},
 schedule:[
  {date:'Nov 28',time:'8AM',title:'Intermediate Womens Doubles',note:'Pool Play upto Finals'},
  {date:'Nov 28',time:'12PM',title:'Low Intermediate Mens Doubles',note:'Pool Play upto Finals'},
  {date:'Nov 29',time:'8AM',title:'High Intermediate Doubles',note:'Pool Play upto Finals'},
  {date:'Nov 29',time:'12PM',title:'Open Gender Advanced',note:'Pool Play upto Finals'}],
 format:[
  {stage:'Pool Play',game:'Sideout 11',win:'No Deuce',time:'15 mins time limit',advance:'Top 2 Advances'},
  {stage:'Quarterfinals',game:'Sideout 11',win:'No Deuce',time:'15 mins time limit',advance:'Knockout Round'},
  {stage:'Semifinals',game:'Sideout 11',win:'Win by 2',time:'No Time Limit',advance:'Knockout Round'},
  {stage:'Finals',game:'Sideout 11',win:'Win by 2',time:'No Time Limit',advance:'Best of 3'}],
 outro:{eyebrow:'Thank you for watching',event:'Mindoro Pickleball Org. Cup 2026',lead:'See you at the',venue:'Balai Mindoro',date:'November 28–29, 2026',
  contactName:'Mr. Roy Albo',contactPhone:'0917 123 1234',facebook:'facebook.com/mindoropickleballorg'}
};
const arr=v=>Array.isArray(v)?v.filter(Boolean):(v&&typeof v==='object'?Object.values(v).filter(Boolean):[]);

/* ---------- views + dock ---------- */
const ICON={
 countdown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
 sponsors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
 draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
 schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 format:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>',
 outro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>'};
const VIEWS=[['countdown','Countdown'],['sponsors','Sponsors'],['draw','Pool draw'],['schedule','Schedule'],['format','Game format'],['outro','Outro']];
$('#dock').innerHTML=VIEWS.map(([id,l],i)=>`<button type="button" data-v="${id}" aria-label="${l}">${ICON[id]}<span class="tip">${l}<kbd>${i+1}</kbd></span></button>`).join('');
let view=null,spLoaded=false;
function show(v){if(!VIEWS.some(x=>x[0]===v))v='countdown';if(v===view)return;view=v;
 document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on',el.id==='v-'+v));
 document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 stage.classList.toggle('full',v==='sponsors'||v==='draw');
 if(v==='sponsors'){const host=$('#v-sponsors');
  if(!spLoaded){spLoaded=true;host.innerHTML='<iframe id="spF" src="../mpo-sponsors.html" title="Sponsors" allow="autoplay; fullscreen"></iframe>';hook($('#spF'))}
  else{try{const w=$('#spF').contentWindow;w.document.dispatchEvent(new w.KeyboardEvent('keydown',{key:'r',bubbles:true}))}catch(e){}}}
 if(v==='schedule')fitList('#schList');if(v==='format')fitList('#fmtList')}
/* local pick: show now, then tell Firebase so setup (and any other copy) follows */
function pick(v){show(v);if(typeof db!=='undefined')db.ref('mpolive/state').set({view:v,at:firebase.database.ServerValue.TIMESTAMP,by:'screen'}).catch(()=>{})}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b.dataset.v)});
function onKey(k){if(/^[1-6]$/.test(k))pick(VIEWS[+k-1][0]);else if(k==='f'||k==='F')toggleFs()}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;onKey(e.key)});
addEventListener('message',e=>{if(e.data&&e.data.type==='mpoliveKey')onKey(e.data.key)});

/* ---------- fit, fullscreen, idle ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
stage.addEventListener('dblclick',e=>{if(!e.target.closest('#dock'))toggleFs()});
let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)};
addEventListener('mousemove',wake);addEventListener('keydown',wake);wake();
/* iframes swallow mouse/keys: listen inside them too (same-origin when served from a web server) */
function hook(f){const on=()=>{try{const w=f.contentWindow;w.addEventListener('mousemove',wake);
  if(f.id==='spF')w.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&/^[1-6]$/.test(e.key))onKey(e.key)})}catch(e){}};f.addEventListener('load',on);on()}
hook($('#drawF'));
/* sound: a click anywhere here unlocks the draw's audio */
addEventListener('click',()=>{try{$('#drawF').contentWindow.unlockAudio&&$('#drawF').contentWindow.unlockAudio()}catch(e){}});

/* ---------- countdown ---------- */
let cd=Object.assign({},DEF.countdown),off=0;
function renderCd(){$('#cdEb').textContent=cd.eyebrow||'';$('#cdText').textContent=cd.text||DEF.countdown.text;$('#cdDone').textContent=cd.doneText||DEF.countdown.doneText;tick()}
function tick(){const w=$('#cdWrap');let ms;
 if(cd.endAt){ms=cd.endAt-(Date.now()+off)}else ms=(+cd.minutes||0)*60000;
 const done=!!cd.endAt&&ms<=0;w.classList.toggle('done',done);$('#cdClock').classList.toggle('tick',!!cd.endAt&&!done);
 if(done)return;const t=Math.ceil(Math.max(0,ms)/1000);$('#cdM').textContent=pad(Math.floor(t/60));$('#cdS').textContent=pad(t%60)}
setInterval(tick,250);

/* ---------- schedule ---------- */
function renderSchedule(list){const g=[];list.forEach(r=>{const d=(r.date||'').trim();let x=g.find(y=>y.d===d);if(!x)g.push(x={d,rows:[]});x.rows.push(r)});
 $('#schList').innerHTML=g.length?g.map(x=>{const m=x.d.match(/^([A-Za-z]+)\.?\s+(\d{1,2})$/);
  const lab=m?`<span class="m">${esc(m[1].slice(0,3))}</span><span class="d">${esc(m[2])}</span>`:`<span class="x">${esc(x.d||'TBA')}</span>`;
  return `<div class="day"><div class="dayL">${lab}</div><div class="rows">${x.rows.map(r=>`<div class="row"><div class="t">${esc(r.time)}</div><div class="n">${esc(r.title)}</div><div class="chip">${esc(r.note)}</div></div>`).join('')}</div></div>`}).join('')
  :'<div class="eb">Schedule coming soon</div>';fitList('#schList')}

/* ---------- format ---------- */
function renderFormat(list){const el=$('#fmtList'),n=list.length;el.style.gridTemplateColumns=`repeat(${n>4?Math.ceil(n/2):Math.max(1,n)},minmax(0,1fr))`;
 el.innerHTML=n?list.map((f,i)=>`<div class="fc"><div class="fh"><span class="no">${pad(i+1)}</span><span class="s">${esc(f.stage)}</span></div><div class="fb">${
  [['Game',f.game],['Scoring',f.win],['Time limit',f.time]].filter(x=>x[1]).map(([k,v])=>`<div class="fl"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}<div class="fa">${esc(f.advance)}</div></div></div>`).join('')
  :'<div class="eb">Format coming soon</div>';fitList('#fmtList')}

/* ---------- outro (empty field = line hidden) ---------- */
function renderOutro(o){o=Object.assign({},DEF.outro,o||{});const set=(id,t)=>{const el=$(id);el.textContent=t||'';el.hidden=!t};
 set('#ouEb',o.eyebrow);set('#ouEv',o.event);set('#ouDt',o.date);
 const see=$('#ouSee');see.innerHTML=(o.lead?esc(o.lead)+' ':'')+(o.venue?`<b>${esc(o.venue)}</b>`:'');see.hidden=!(o.lead||o.venue);
 const who=[o.contactName,o.contactPhone].filter(Boolean).join(' · '),rows=[];
 if(who)rows.push(`<span>Questions</span><b>${esc(who)}</b>`);if(o.facebook)rows.push(`<span>Facebook</span><b>${esc(o.facebook)}</b>`);
 const ct=$('#ouCt');ct.innerHTML=rows.join('');ct.hidden=!rows.length;
 /* long venue: shrink the headline so it stays inside the screen */
 let f=96;see.style.fontSize=f+'px';while(see.scrollHeight>230&&f>56){f-=4;see.style.fontSize=f+'px'}}

/* shrink a list to fit the space above the footer */
function fitList(sel){const el=$(sel);el.style.transform='';const top=el.getBoundingClientRect().top,stageR=stage.getBoundingClientRect(),sc=stageR.height/1080;
 const avail=(stageR.top+930*sc-top)/sc,h=el.scrollHeight;if(h>avail&&avail>0)el.style.transform=`scale(${Math.max(.45,avail/h)})`}

/* ---------- Firebase ---------- */
renderCd();renderSchedule(DEF.schedule);renderFormat(DEF.format);renderOutro();show('countdown');
/* db comes from firebase-config.js */
const HAS_DB=typeof db!=='undefined';
if(!HAS_DB)$('#conn').textContent='Cannot start Firebase. Check firebase-config.js';
if(HAS_DB){
 db.ref('.info/serverTimeOffset').on('value',s=>{off=+s.val()||0});
 db.ref('.info/connected').on('value',s=>{$('#conn').textContent=s.val()?'':'Reconnecting…'});
 db.ref('mpolive/state/view').on('value',s=>{if(s.val())show(s.val())});
 db.ref('mpolive/countdown').on('value',s=>{cd=Object.assign({},DEF.countdown,s.val()||{});renderCd()});
 db.ref('mpolive/schedule').on('value',s=>renderSchedule(s.exists()?arr(s.val()):DEF.schedule));
 db.ref('mpolive/format').on('value',s=>renderFormat(s.exists()?arr(s.val()):DEF.format));
 db.ref('mpolive/outro').on('value',s=>renderOutro(s.val()));
 db.ref('mpolive/settings/eventName').on('value',s=>{const n=s.val()||DEF.settings.eventName;$('#evName').textContent=n;$('#schEb').textContent=n;$('#fmtEb').textContent=n});
}
document.fonts&&document.fonts.ready.then(()=>{fitList('#schList');fitList('#fmtList')});
</script>
</body>
