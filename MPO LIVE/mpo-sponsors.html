<!DOCTYPE html>
<!-- mpo-sponsors.html: Mindoro Pickleball Org. Cup sponsor showcase ("Halcon Ridge").
     Same data as tvurl.html (sponsor-store.js). Played by mpo-display2.html "Show Sponsors" with ?once=1.
     ?demo=1 = sample sponsors, F = fullscreen, R = restart. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponsors · Mindoro Pickleball Org. Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1D17; --ink:#0B1D17; --cream:#F3F1E8; --dim:#A9C3B6; --forest:#0F3B2E; --card:#F6F4EC;
    --ball:#D7F03C; --clay:#E27A5C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body.idle{cursor:none}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
    background:linear-gradient(180deg,#06120E 0%,#0B1D17 48%,#15342A 66%,#0B1D17 100%);
    font-family:Archivo,system-ui,sans-serif;color:var(--cream)}
  .layer{position:absolute;inset:0;pointer-events:none}
  #glow{background:radial-gradient(ellipse 820px 320px at 50% 64%,rgba(227,164,95,.32),rgba(227,164,95,0) 72%)}
  #dusk{background:radial-gradient(ellipse 1100px 420px at 50% 66%,rgba(214,112,62,.38),rgba(214,112,62,0) 72%);opacity:0}
  #stars,#land,#frame{position:absolute;left:0;display:block}
  #stars{top:0;width:1920px;height:600px}
  #land{top:660px;width:1920px;height:420px;overflow:visible}
  #frame{top:0;width:1920px;height:1080px}

  /* the ball (also the sun) */
  #sun{position:absolute;left:885px;top:625px;width:150px;height:150px;visibility:hidden}
  #ball{position:absolute;left:0;top:0;width:60px;height:60px;z-index:20;visibility:hidden;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
  #ball .core{width:100%;height:100%;transform-origin:50% 100%}
  #ball .tex{width:100%;height:100%}
  #ball svg,#sun svg{display:block;width:100%;height:100%}
  .ring{position:absolute;left:0;top:0;width:130px;height:130px;border-radius:50%;border:2px solid var(--cream)}

  /* peak marker */
  #peak{visibility:hidden}
  #peak .lbl{position:absolute;left:1114px;top:744px;display:flex;flex-direction:column;gap:4px}
  #peak .lbl b{font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,241,232,.8)}
  #peak .lbl span{font-family:Inter,sans-serif;font-size:14px;font-weight:500;color:rgba(169,195,182,.85)}

  #content,#fx{position:absolute;inset:0}
  #fx{pointer-events:none}
  .scene{position:absolute;inset:0;visibility:hidden}

  /* type */
  .center-col{position:absolute;left:0;right:0;top:10px;height:590px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 200px}
  .mark{height:96px;width:auto;display:block;margin-bottom:28px}
  .eyebrow{font-weight:700;font-size:25px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:24px}
  .headline{font-weight:800;font-stretch:105%;font-size:82px;line-height:1.1;max-width:1500px}
  .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .08em}
  .wi{display:inline-block}
  .hl{color:var(--ball)}
  .chip{margin-top:38px;font-family:Inter,sans-serif;font-weight:600;font-size:24px;padding:12px 28px;border:1.5px solid rgba(243,241,232,.3);border-radius:999px;color:rgba(243,241,232,.9)}

  /* tier title: the Halcon profile is traced by the ball */
  .tier-wrap{position:absolute;left:0;right:0;top:250px;text-align:center}
  .tier-eyebrow{font-weight:700;font-size:30px;letter-spacing:.34em;text-transform:uppercase;color:#C9D8CF;margin-bottom:18px}
  .tier-title{font-weight:900;font-stretch:112%;font-size:150px;line-height:1;text-transform:uppercase;letter-spacing:.01em;display:inline-block;padding:.05em .2em;margin:-.05em -.2em}
  .tier-title .hl{color:var(--ball)}
  .trace{position:absolute;inset:0;width:1920px;height:1080px;display:block;overflow:visible}

  /* section head */
  .sec-head{position:absolute;left:0;right:0;top:104px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .sec-head .t{font-weight:800;font-size:36px;letter-spacing:.3em;text-transform:uppercase}
  .sec-head svg{display:block}
  .page-dots{display:flex;gap:10px;justify-content:center}
  .page-dots i{width:10px;height:10px;border-radius:50%;background:rgba(243,241,232,.25)}
  .page-dots i.on{background:var(--ball)}

  /* major card */
  .mcard{position:absolute;left:410px;top:200px;width:1100px;height:570px;border-radius:24px;background:var(--card);color:var(--ink);overflow:hidden;
    box-shadow:0 36px 70px rgba(0,0,0,.5);display:flex;flex-direction:column}
  .mhead{position:relative;height:76px;flex:none;background:var(--forest);color:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:0 36px;overflow:hidden}
  .mhead svg.bgline{position:absolute;inset:0;width:1100px;height:76px;display:block}
  .mhead .k{position:relative;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
  .mhead .k svg{display:block}
  .mhead .n{position:relative;font-size:24px;font-weight:700;font-stretch:115%;letter-spacing:.08em;color:var(--dim)}
  .mbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:40px 60px}
  .mbody .logo{width:940px;height:300px;display:flex;align-items:center;justify-content:center}
  .mbody .logo img{max-width:100%;max-height:100%;object-fit:contain}
  .mbody .big{font-weight:800;line-height:1.05;text-align:center}
  .mband{height:132px;flex:none;background:var(--forest);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;padding:0 40px;line-height:1.05}

  /* minor cards */
  .ncard{position:absolute;width:420px;height:250px;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 24px 50px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 26px 22px;overflow:hidden}
  .ncard .idx{position:absolute;left:18px;top:14px;font-size:16px;font-weight:700;letter-spacing:.14em;color:#6F7E74}
  .ncard .logo{width:350px;height:130px;display:flex;align-items:center;justify-content:center}
  .ncard .logo img{max-width:100%;max-height:100%;object-fit:contain}
  .ncard .nm{font-weight:700;text-align:center;line-height:1.1}
  .ncard.nologo .nm{font-weight:800}
  .ncard.nologo .bar{width:64px;height:6px;border-radius:3px;background:#0F4C3A}

  /* special thanks */
  .thanks{position:absolute;left:160px;right:160px;top:250px;bottom:230px;display:grid;grid-auto-flow:column;align-content:center;justify-content:center;column-gap:90px;row-gap:28px}
  .titem{display:flex;align-items:center;gap:20px;font-weight:700;line-height:1.15;min-width:0}
  .titem .lg{width:76px;height:76px;flex:none;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
  .titem .lg img{max-width:100%;max-height:100%;object-fit:contain}
  .titem svg{flex:none;display:block}

  /* outro */
  .outro-title{font-weight:900;font-stretch:108%;font-size:150px;line-height:1.05}
  .outro-text{font-family:Inter,sans-serif;font-size:36px;font-weight:500;color:rgba(243,241,232,.86);margin-top:28px;max-width:1300px}

  /* footer */
  #footer{position:absolute;left:64px;right:64px;bottom:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);z-index:5}
  #footer .ev{display:flex;align-items:center;gap:14px}
  #footer .ev img{height:34px;width:auto;display:block}
  #footer .geo{font-size:16px;font-weight:600;letter-spacing:.24em;color:rgba(169,195,182,.7)}
  #footer #fTier{min-width:320px;text-align:right}
  #status{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:22px;color:rgba(255,255,255,.6);z-index:30;text-align:center;font-family:Inter,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="glow"></div>
  <div class="layer" id="dusk"></div>
  <svg id="stars" viewBox="0 0 1920 600" aria-hidden="true"><g fill="#F3F1E8"></g></svg>
  <div id="sun"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#D7F03C"/><g fill="#000" opacity=".2"><circle cx="50" cy="20" r="6"/><circle cx="23" cy="40" r="6"/><circle cx="77" cy="40" r="6"/><circle cx="32" cy="72" r="6"/><circle cx="68" cy="72" r="6"/><circle cx="50" cy="50" r="5"/></g></svg></div>

  <!-- Halcon ridges (far range, Halcon with contour lines, mid, front) -->
  <svg id="land" viewBox="0 0 1920 420" aria-hidden="true">
    <defs>
      <clipPath id="cb"><path d="M0 250 C150 230 260 170 400 176 C500 180 570 130 680 112 C770 98 840 60 900 40 L960 20 L1020 44 C1100 74 1170 100 1270 108 C1400 118 1480 170 1600 182 C1720 194 1830 222 1920 216 L1920 420 L0 420 Z"/></clipPath>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C3B6" stop-opacity="0"/><stop offset=".5" stop-color="#A9C3B6" stop-opacity=".09"/><stop offset="1" stop-color="#A9C3B6" stop-opacity="0"/></linearGradient>
      <path id="halconTop" d="M0 250 C150 230 260 170 400 176 C500 180 570 130 680 112 C770 98 840 60 900 40 L960 20 L1020 44 C1100 74 1170 100 1270 108 C1400 118 1480 170 1600 182 C1720 194 1830 222 1920 216"/>
    </defs>
    <g id="rFar"><path fill="#132E25" d="M0 190 C120 160 220 120 330 126 C430 132 500 90 590 70 C660 56 720 84 780 96 C860 110 900 70 960 60 C1040 50 1120 96 1200 92 C1300 88 1360 40 1440 36 C1520 32 1600 90 1700 110 C1800 130 1870 150 1920 156 L1920 420 L0 420 Z"/></g>
    <rect id="rMist" x="0" y="80" width="1920" height="190" fill="url(#mist)"/>
    <g id="rBack">
      <path fill="#1A4436" d="M0 250 C150 230 260 170 400 176 C500 180 570 130 680 112 C770 98 840 60 900 40 L960 20 L1020 44 C1100 74 1170 100 1270 108 C1400 118 1480 170 1600 182 C1720 194 1830 222 1920 216 L1920 420 L0 420 Z"/>
      <g clip-path="url(#cb)" fill="none" stroke="#F3F1E8" stroke-opacity=".08" stroke-width="1.5">
        <use href="#halconTop" transform="translate(0 28)"/><use href="#halconTop" transform="translate(0 56)"/><use href="#halconTop" transform="translate(0 84)"/>
        <use href="#halconTop" transform="translate(0 112)"/><use href="#halconTop" transform="translate(0 140)"/>
      </g>
    </g>
    <path id="rLine" pathLength="1" fill="none" stroke="#F3F1E8" stroke-opacity=".4" stroke-width="2" stroke-dasharray="1" d="M0 250 C150 230 260 170 400 176 C500 180 570 130 680 112 C770 98 840 60 900 40 L960 20 L1020 44 C1100 74 1170 100 1270 108 C1400 118 1480 170 1600 182 C1720 194 1830 222 1920 216"/>
    <g id="rMid"><path fill="#123326" d="M0 300 C160 282 270 254 410 262 C530 268 610 222 730 210 C830 200 900 240 1000 234 C1120 226 1200 178 1330 176 C1460 174 1560 232 1700 240 C1800 246 1880 264 1920 268 L1920 420 L0 420 Z"/></g>
    <g id="rFront"><path fill="#0D251C" d="M0 352 C200 340 360 334 520 344 C700 354 820 322 980 318 C1160 314 1280 346 1460 344 C1640 342 1780 332 1920 338 L1920 420 L0 420 Z"/></g>
  </svg>

  <!-- peak marker, like a map label -->
  <div class="layer" id="peak">
    <svg viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:1920px;height:1080px;display:block" aria-hidden="true">
      <path d="M960 672 L967 684 L953 684 Z" fill="#F3F1E8"/>
      <polyline points="972,690 1050,760 1104,760" fill="none" stroke="#F3F1E8" stroke-opacity=".55" stroke-width="1.5"/>
    </svg>
    <div class="lbl"><b>Bundok Halcon</b><span>Oriental Mindoro</span></div>
  </div>

  <!-- map-frame corners -->
  <svg id="frame" viewBox="0 0 1920 1080" aria-hidden="true">
    <g fill="none" stroke="#F3F1E8" stroke-opacity=".28" stroke-width="2">
      <polyline points="32,76 32,32 76,32"/><polyline points="1844,32 1888,32 1888,76"/>
      <polyline points="32,1004 32,1048 76,1048"/><polyline points="1844,1048 1888,1048 1888,1004"/>
    </g>
  </svg>

  <div id="content"></div>
  <div id="fx"></div>
  <div id="ball"><div class="core"><div class="tex"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#D7F03C"/><g fill="#000" opacity=".2"><circle cx="50" cy="20" r="6"/><circle cx="23" cy="40" r="6"/><circle cx="77" cy="40" r="6"/><circle cx="32" cy="72" r="6"/><circle cx="68" cy="72" r="6"/><circle cx="50" cy="50" r="5"/></g></svg></div></div></div>
  <div id="footer"><span class="ev"><img src="mpo-mark.png" alt=""><span id="fEvent"></span></span><span class="geo">13°N · 121°E</span><span id="fTier"></span></div>
  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sponsor-store.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const stage = $('stage'), content = $('content'), fx = $('fx');
  const ball = $('ball'), core = ball.querySelector('.core'), tex = ball.querySelector('.tex');
  const sun = $('sun'), glow = $('glow'), dusk = $('dusk'), stars = $('stars'), peak = $('peak');
  const ridges = ['rFar', 'rBack', 'rMid', 'rFront'].map($), rLine = $('rLine'), rMist = $('rMist');
  const params = new URLSearchParams(location.search);
  const DEFAULT_EVENT = 'Mindoro Pickleball Org. Cup 2026';
  // ?once=1 (used by mpo-display2.html "Show Sponsors"): play one loop, then tell the parent page it's done
  const ONCE = params.get('once') === '1';
  let doneSent = false;
  function finishOnce(){ if (doneSent) return; doneSent = true; try { if (parent !== window) parent.postMessage({ type: 'sponsorShowDone' }, '*'); } catch (e) {} }

  if (!window.gsap) { $('status').textContent = 'Animation library failed to load. Check the internet connection, then refresh.'; if (ONCE) setTimeout(finishOnce, 4000); return; }

  // ---------- fit 1920x1080 stage to any screen ----------
  function fit(){ const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  // ---------- stars (fixed positions so every loop looks the same) ----------
  const STARS = [[703,194,2.4],[1373,89,1.2],[1721,136,2],[1233,99,1.6],[116,128,2.4],[896,111,1.6],[225,474,1.2],[1733,166,1.6],[1331,103,2.4],[141,266,1.2],[1180,176,2],[898,187,1.2],[1209,355,1.6],[251,232,2],[239,104,1.2],[1307,250,2.4],[1433,477,2],[653,294,1.6],[1471,289,1.2],[1832,391,2.4],[629,114,1.2],[1590,390,1.6],[1408,119,2],[1760,135,2],[1010,106,1.2],[1537,357,2.4],[86,512,2],[384,159,2.4],[160,263,2],[304,293,2.4],[1717,480,2],[1486,465,2]];
  stars.querySelector('g').innerHTML = STARS.map((p, k) => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" opacity="${(0.35 + (k % 4) * 0.15).toFixed(2)}"/>`).join('');

  // ---------- helpers ----------
  const div = (cls, text) => { const e = document.createElement('div'); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pad2 = n => String(n).padStart(2, '0');
  function splitWords(el, text, re){
    el.textContent = '';
    String(text || '').split(/\s+/).filter(Boolean).forEach(w => {
      const o = document.createElement('span'); o.className = 'w';
      const i = document.createElement('span'); i.className = 'wi'; i.textContent = w;
      if (re && re.test(w)) i.classList.add('hl');
      o.append(i); el.append(o, ' ');
    });
    return el.querySelectorAll('.wi');
  }
  function fitFont(text, base, min, ideal){ const n = String(text).length; return Math.max(min, Math.min(base, Math.round(base * ideal / Math.max(n, 1)))); }
  function logoEl(src){ const b = div('logo'); const im = new Image(); im.src = src; im.alt = ''; b.append(im); return b; }
  function scene(){ const s = div('scene'); content.append(s); return s; }
  // pakudos: the cross-shaped motif from Hanunuo Mangyan embroidery
  const pakudos = (s, color) => `<svg viewBox="0 0 14 14" width="${s}" height="${s}" aria-hidden="true"><g fill="${color || 'var(--ball)'}"><rect x="5" y="5" width="4" height="4"/><rect x="5" y="0" width="4" height="4"/><rect x="5" y="10" width="4" height="4"/><rect x="0" y="5" width="4" height="4"/><rect x="10" y="5" width="4" height="4"/></g></svg>`;
  const divider = () => `<svg viewBox="0 0 160 14" width="160" height="14" aria-hidden="true"><g fill="#D7F03C"><rect x="77" y="5" width="4" height="4"/><rect x="77" y="0" width="4" height="4"/><rect x="77" y="10" width="4" height="4"/><rect x="72" y="5" width="4" height="4"/><rect x="82" y="5" width="4" height="4"/></g><rect x="0" y="6" width="62" height="2" fill="#F3F1E8" fill-opacity=".35"/><rect x="98" y="6" width="62" height="2" fill="#F3F1E8" fill-opacity=".35"/></svg>`;
  const peakIcon = '<svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M10 0 L20 16 L0 16 Z" fill="#D7F03C"/></svg>';

  // ---------- ball physics (build-time position tracking) ----------
  let bp = { x: -100, y: 800 };
  function place(tl, x, y, at){ bp = { x, y }; tl.set(ball, { x, y, autoAlpha: 1, scale: 1 }, at); }
  function hop(tl, x, y, h, d, at){
    const x1 = bp.x, y1 = bp.y, apex = Math.min(y1, y) - h;
    tl.to(ball, { x, duration: d, ease: 'none' }, at);
    tl.to(tex, { rotation: '+=' + Math.round((x - x1) * 0.9), duration: d, ease: 'none' }, at);
    tl.to(ball, { y: apex, duration: d * 0.5, ease: 'power2.out' }, at);
    tl.to(ball, { y, duration: d * 0.5, ease: 'power2.in' }, at + d * 0.5);
    tl.to(core, { scaleY: 0.72, scaleX: 1.22, duration: 0.07, yoyo: true, repeat: 1, ease: 'power1.out' }, at + d);
    bp = { x, y };
    return at + d;
  }
  // landing: two thin rings spread like contour lines (no sparks)
  function rings(tl, x, y, at, size){
    size = size || 1;
    [0, 0.14].forEach(off => {
      const r = div('ring'); fx.append(r);
      gsap.set(r, { x, y, xPercent: -50, yPercent: -50, scale: 0, autoAlpha: 0 });
      tl.fromTo(r, { scale: 0.2, autoAlpha: 0.7 }, { scale: 3.2 * size, autoAlpha: 0, duration: 1 + off, ease: 'expo.out', immediateRender: false }, at + off);
    });
  }
  const footTier = (tl, txt, at) => tl.call(() => { $('fTier').textContent = txt; }, null, at);

  // ---------- scenes ----------
  // 1 · Intro: dawn. Stars fade, the ridges rise and the Halcon line draws, the ball rises over the peak like the sun.
  function sIntro(S){
    const tl = gsap.timeline(), sc = scene();
    const col = div('center-col');
    const mk = new Image(); mk.src = 'mpo-mark.png'; mk.alt = ''; mk.className = 'mark';
    const eb = div('eyebrow', S.eyebrow || '');
    const hd = div('headline'); hd.style.fontSize = fitFont(S.introText || '', 82, 56, 62) + 'px';
    const ws = splitWords(hd, S.introText, /sponsor/i);
    col.append(mk, eb, hd);
    let chip = null;
    if (S.eventName){ chip = div('chip', S.eventName); col.append(chip); }
    sc.append(col);
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, '', 0);
    gsap.set([mk, eb, chip].filter(Boolean), { autoAlpha: 0 }); gsap.set(ws, { yPercent: 115 });

    tl.set([stars, rMist].concat(ridges), { autoAlpha: 1 }, 0);
    tl.set(dusk, { autoAlpha: 0 }, 0);
    tl.set(peak, { autoAlpha: 0 }, 0);
    tl.fromTo(glow, { autoAlpha: 0 }, { autoAlpha: 1, duration: 2.6, ease: 'power1.out' }, 0.8);
    tl.to(stars, { autoAlpha: 0, duration: 2.4, ease: 'power1.in' }, 1.2);
    tl.fromTo(ridges, { y: 170 }, { y: 0, duration: 1.3, stagger: 0.1, ease: 'expo.out' }, 0);
    tl.fromTo(rMist, { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.2 }, 0.6);
    tl.fromTo(rLine, { strokeDashoffset: 1, autoAlpha: 1 }, { strokeDashoffset: 0, duration: 1.9, ease: 'power2.inOut' }, 0.35);
    tl.fromTo(sun, { y: 240, autoAlpha: 1 }, { y: -50, duration: 2.3, ease: 'expo.out' }, 0.7);
    tl.to(peak, { autoAlpha: 1, duration: 0.8 }, 2.4);

    tl.fromTo(mk, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.4);
    tl.fromTo(eb, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.6);
    tl.to(ws, { yPercent: 0, duration: 0.9, stagger: 0.06, ease: 'expo.out' }, 1.7);
    if (chip) tl.fromTo(chip, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 2.5);

    const out = 2.5 + Math.max(3.5, ws.length * 0.06);
    tl.to(ws, { yPercent: -115, duration: 0.55, stagger: 0.025, ease: 'power3.in' }, out);
    tl.to([mk, eb, chip].filter(Boolean), { autoAlpha: 0, duration: 0.4 }, out + 0.2);
    tl.to([sun, peak], { autoAlpha: 0, duration: 0.6 }, out + 0.1);
    tl.set(sc, { autoAlpha: 0 }, out + 0.8);
    return tl;
  }

  const TIER = {
    major:   { eyebrow: 'Presenting our', words: ['Major', 'Sponsors'],  foot: 'Major Sponsors' },
    minor:   { eyebrow: 'Supported by our', words: ['Minor', 'Sponsors'], foot: 'Minor Sponsors' },
    special: { eyebrow: 'With special thanks to', words: ['Special', 'Thanks'], foot: 'Special Thanks' }
  };

  // 2 · Tier title: the ball runs along the Halcon profile; the line draws behind it and the title is revealed above.
  const TR = { x: 210, y: 513, sx: 0.78125, sy: 0.35 };   // Halcon top line → 1500px wide trace under the title
  function sTier(type){
    const T = TIER[type], tl = gsap.timeline(), sc = scene();
    const wrap = div('tier-wrap');
    const eb = div('tier-eyebrow', T.eyebrow);
    const ti = div('tier-title');
    const a = document.createElement('span'); a.textContent = T.words[0] + ' ';
    const b = document.createElement('span'); b.className = 'hl'; b.textContent = T.words[1];
    ti.append(a, b); wrap.append(eb, ti);
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'trace'); svg.setAttribute('viewBox', '0 0 1920 1080'); svg.setAttribute('aria-hidden', 'true');
    const g = document.createElementNS(NS, 'g'); g.setAttribute('transform', `translate(${TR.x} ${TR.y}) scale(${TR.sx} ${TR.sy})`);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', document.getElementById('halconTop').getAttribute('d'));
    ['fill:none', 'stroke:#F3F1E8', 'stroke-width:3', 'stroke-linecap:round', 'vector-effect:non-scaling-stroke'].forEach(r => { const [k, v] = r.split(':'); p.style.setProperty(k, v); });
    g.append(p); svg.append(g);
    sc.append(svg, wrap);
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, T.foot, 0);
    gsap.set(eb, { autoAlpha: 0 });
    gsap.set(ti, { clipPath: 'inset(0% 100% 0% 0%)' });

    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    const at = len => { const q = p.getPointAtLength(len); return { x: TR.x + q.x * TR.sx, y: TR.y + q.y * TR.sy - 28 }; };
    const s0 = at(0), D = 1.1, N = 48;
    const pts = Array.from({ length: N }, (_, j) => at(L * (j + 1) / N));
    place(tl, s0.x, s0.y, 0.1);
    tl.fromTo(ball, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.2 }, 0.1);
    tl.to(p, { strokeDashoffset: 0, duration: D, ease: 'none' }, 0.1);
    tl.to(ball, { keyframes: pts.map(q => ({ x: q.x, y: q.y, duration: D / N, ease: 'none' })) }, 0.1);   // ride the Halcon profile
    tl.to(tex, { rotation: '+=1200', duration: D, ease: 'none' }, 0.1);
    tl.to(ti, { clipPath: 'inset(0% 0% 0% 0%)', duration: D, ease: 'none' }, 0.12);
    const end = at(L);
    bp = { x: end.x, y: end.y };
    hop(tl, 2010, end.y - 40, 90, 0.5, 0.1 + D);
    tl.fromTo(eb, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.5);
    tl.fromTo(ti, { scale: 1.03 }, { scale: 1, duration: 2, ease: 'power2.out' }, 0.2);

    const out = 2.7;
    tl.to(ti, { clipPath: 'inset(0% 0% 0% 100%)', duration: 0.5, ease: 'power3.in' }, out);
    tl.to(eb, { autoAlpha: 0, y: -16, duration: 0.4 }, out);
    tl.to(svg, { autoAlpha: 0, duration: 0.45 }, out);
    tl.set(sc, { autoAlpha: 0 }, out + 0.55);
    return tl;
  }

  // 3 · Major: serve lands, two contour rings, the card opens. Header bar says which one of how many.
  function sMajor(sp, i, n, secs){
    const tl = gsap.timeline(), sc = scene();
    const card = div('mcard');
    const head = div('mhead');
    head.innerHTML = `<svg class="bgline" viewBox="0 0 1100 76" aria-hidden="true"><path fill="none" stroke="#F3F1E8" stroke-opacity=".12" stroke-width="1.5" d="M0 70 C80 66 140 54 210 56 C270 58 300 44 350 40 C390 36 420 28 450 22 L480 14 L510 24 C550 34 590 42 640 44 C710 46 750 58 810 60 C880 62 950 66 1100 64"/><path fill="none" stroke="#F3F1E8" stroke-opacity=".07" stroke-width="1.5" d="M0 76 C80 72 140 62 210 64 C270 66 300 54 350 50 C390 46 420 40 450 34 L480 28 L510 36 C550 44 590 50 640 52 C710 54 750 64 810 66 C880 68 950 72 1100 70"/></svg>`;
    const k = div('k'); k.innerHTML = peakIcon; k.append(document.createTextNode('Major Sponsor'));
    const num = div('n', `${pad2(i + 1)} / ${pad2(n)}`);
    head.append(k, num);
    const body = div('mbody');
    let logo = null, nm;
    if (sp.logo){
      logo = logoEl(sp.logo); body.append(logo);
      nm = div('mband', sp.name); nm.style.fontSize = fitFont(sp.name, 58, 34, 26) + 'px';
      card.append(head, body, nm);
    } else {
      nm = div('big', sp.name); nm.style.fontSize = fitFont(sp.name, 110, 56, 14) + 'px';
      body.append(nm); card.append(head, body);
    }
    sc.append(card);
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, 'Major Sponsors', 0);
    gsap.set([card, nm], { autoAlpha: 0 });

    const fromRight = i % 2 === 1;
    place(tl, fromRight ? 2010 : -90, 240, 0.05);
    const land = hop(tl, 960, 490, 170, 0.85, 0.05);
    rings(tl, 960, 490, land, 1);
    tl.to(ball, { autoAlpha: 0, scale: 0.4, duration: 0.15 }, land);
    tl.fromTo(card, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.85, ease: 'back.out(1.2)' }, land);
    tl.fromTo(nm, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, land + 0.35);
    if (logo) tl.fromTo(logo, { scale: 0.94 }, { scale: 1.02, duration: secs + 0.6, ease: 'none' }, land);

    const out = land + secs;
    tl.to(card, { autoAlpha: 0, scale: 0.95, y: -30, duration: 0.5, ease: 'power2.in' }, out);
    tl.set(sc, { autoAlpha: 0 }, out + 0.55);
    bp = { x: 960, y: 490 };
    return tl;
  }

  function secHead(title, page, pages){
    const h = div('sec-head');
    h.append(div('t', title));
    const d = document.createElement('div'); d.innerHTML = divider(); h.append(d.firstChild);
    if (pages > 1){
      const dots = div('page-dots');
      for (let k = 0; k < pages; k++){ const i = document.createElement('i'); if (k === page) i.className = 'on'; dots.append(i); }
      h.append(dots);
    }
    return h;
  }

  // 4 · Minor: the ball rallies across the tops of the cards; each landing pops a card.
  function sMinor(items, page, pages, startIdx, secs){
    const tl = gsap.timeline(), sc = scene();
    const head = secHead('Minor Sponsors', page, pages);
    sc.append(head);
    const n = items.length;
    const cols = n <= 4 ? n : Math.ceil(n / 2), rows = n <= 4 ? 1 : 2;
    const CW = 420, CH = 250, GX = 50, GY = 50;
    const gridH = rows * CH + (rows - 1) * GY, top0 = 575 - gridH / 2;
    const cards = items.map((sp, k) => {
      const r = Math.floor(k / cols), inRow = r === rows - 1 ? n - cols * (rows - 1) : cols, c = k - r * cols;
      const rowW = inRow * CW + (inRow - 1) * GX, left = 960 - rowW / 2 + c * (CW + GX), top = top0 + r * (CH + GY);
      const card = div('ncard' + (sp.logo ? '' : ' nologo'));
      card.style.left = left + 'px'; card.style.top = top + 'px';
      card.append(div('idx', pad2(startIdx + k + 1)));
      if (sp.logo) card.append(logoEl(sp.logo));
      const nm = div('nm', sp.name);
      nm.style.fontSize = sp.logo ? fitFont(sp.name, 26, 18, 24) + 'px' : fitFont(sp.name, 40, 24, 16) + 'px';
      card.append(nm);
      if (!sp.logo) card.append(div('bar'));
      sc.append(card);
      return { el: card, cx: left + CW / 2, top };
    });
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, 'Minor Sponsors', 0);
    gsap.set(cards.map(c => c.el), { autoAlpha: 0 });
    tl.fromTo(head, { autoAlpha: 0, y: -20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0);

    place(tl, -90, cards[0].top - 160, 0.1);
    let t = 0.1;
    cards.forEach((c, k) => {
      const prev = k ? cards[k - 1] : null;
      const d = prev && prev.top !== c.top ? 0.55 : 0.42;
      t = hop(tl, c.cx, c.top - 32, k ? 120 : 90, d, t);
      tl.fromTo(c.el, { autoAlpha: 0, scale: 0.3, y: 30 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.6)' }, t);
    });
    hop(tl, 2010, cards[cards.length - 1].top - 200, 140, 0.55, t);

    const out = t + secs;
    tl.to(cards.map(c => c.el), { autoAlpha: 0, scale: 0.9, y: -20, duration: 0.45, stagger: 0.04, ease: 'power2.in' }, out);
    tl.to(head, { autoAlpha: 0, duration: 0.4 }, out + 0.1);
    tl.set(sc, { autoAlpha: 0 }, out + 0.5 + cards.length * 0.04);
    return tl;
  }

  // 5 · Special thanks: names fade up, pakudos bullets.
  function sSpecial(items, page, pages, secs){
    const tl = gsap.timeline(), sc = scene();
    const head = secHead('Special Thanks', page, pages);
    const n = items.length, cols = n <= 5 ? 1 : n <= 10 ? 2 : 3, rows = Math.ceil(n / cols);
    const grid = div('thanks');
    grid.style.gridTemplateRows = `repeat(${rows}, auto)`;
    const size = cols === 3 ? 38 : cols === 2 ? 46 : 54;
    const els = items.map(sp => {
      const it = div('titem');
      if (sp.logo){ const lg = div('lg'); const im = new Image(); im.src = sp.logo; im.alt = ''; lg.append(im); it.append(lg); }
      else it.insertAdjacentHTML('beforeend', pakudos(22));
      const t = document.createElement('span'); t.textContent = sp.name;
      it.style.fontSize = fitFont(sp.name, size, 26, cols === 3 ? 22 : 30) + 'px';
      it.append(t); grid.append(it); return it;
    });
    sc.append(head, grid);
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, 'Special Thanks', 0);
    gsap.set(els, { autoAlpha: 0 });
    tl.fromTo(head, { autoAlpha: 0, y: -20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0);
    tl.to(els, { autoAlpha: 1, y: 0, duration: 0.6, stagger: 0.09, ease: 'power3.out', startAt: { y: 26 } }, 0.3);

    const out = 0.3 + els.length * 0.09 + 0.6 + secs - 1;
    tl.to(els, { autoAlpha: 0, y: -16, duration: 0.4, stagger: 0.02, ease: 'power2.in' }, out);
    tl.to(head, { autoAlpha: 0, duration: 0.4 }, out);
    tl.set(sc, { autoAlpha: 0 }, out + 0.45 + els.length * 0.02);
    return tl;
  }

  // 6 · Outro: dusk. The ball sets behind Halcon; everything clears for the next loop.
  function sOutro(S){
    const tl = gsap.timeline(), sc = scene();
    const col = div('center-col');
    const ti = div('outro-title'); const ws = splitWords(ti, S.outroTitle || 'Thank you!', /salamat|thank/i);
    const tx = div('outro-text', S.outroText || '');
    col.append(ti, tx);
    let chip = null;
    if (S.eventName){ chip = div('chip', S.eventName); col.append(chip); }
    sc.append(col);
    tl.set(sc, { autoAlpha: 1, immediateRender: false }, 0);
    footTier(tl, '', 0);
    gsap.set(ws, { yPercent: 115 }); gsap.set([tx, chip].filter(Boolean), { autoAlpha: 0 });

    tl.set(sun, { y: -50, autoAlpha: 0 }, 0);
    tl.to(sun, { autoAlpha: 1, duration: 0.8 }, 0.2);
    tl.to(peak, { autoAlpha: 1, duration: 0.8 }, 0.3);
    tl.to(dusk, { autoAlpha: 1, duration: 3, ease: 'power1.inOut' }, 1.8);
    tl.to(sun, { y: 240, duration: 3.1, ease: 'power2.inOut' }, 2.5);
    tl.to(ws, { yPercent: 0, duration: 1, stagger: 0.07, ease: 'expo.out' }, 0.2);
    tl.fromTo(tx, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.7);
    if (chip) tl.fromTo(chip, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1);

    const out = 6;
    tl.to(ws, { yPercent: -115, duration: 0.6, stagger: 0.04, ease: 'power3.in' }, out);
    tl.to([tx, chip].filter(Boolean), { autoAlpha: 0, duration: 0.5 }, out + 0.1);
    tl.to([peak, glow, dusk, rLine, rMist].concat(ridges), { autoAlpha: 0, duration: 0.8 }, out + 0.3);
    tl.set(sun, { autoAlpha: 0 }, out + 1);
    tl.set(sc, { autoAlpha: 0 }, out + 1.1);
    return tl;
  }

  // ---------- show builder ----------
  const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  let latest = null, current = null, currentHasSponsors = false;

  function buildShow(d){
    gsap.killTweensOf([ball, core, tex, sun, glow, dusk, stars, peak, rLine, rMist].concat(ridges));
    content.innerHTML = ''; fx.innerHTML = '';
    gsap.set(ball, { xPercent: -50, yPercent: -50, autoAlpha: 0, scale: 1 });
    gsap.set(core, { scaleX: 1, scaleY: 1 });
    const S = d.settings;
    const num = (v, def) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : def; };
    const ms = num(S.majorSeconds, 6), ns = num(S.minorSeconds, 6), ss = num(S.specialSeconds, 7);
    const by = t => d.sponsors.filter(s => s.type === t);
    const majors = by('major'), minors = by('minor'), specials = by('special');
    $('fEvent').textContent = S.eventName || DEFAULT_EVENT;

    const tl = gsap.timeline({ onComplete: ONCE ? finishOnce : run });
    tl.add(sIntro(S));
    if (majors.length){ tl.add(sTier('major')); majors.forEach((sp, i) => tl.add(sMajor(sp, i, majors.length, ms))); }
    if (minors.length){
      const pages = chunk(minors, 8);
      tl.add(sTier('minor'));
      pages.forEach((p, i) => tl.add(sMinor(p, i, pages.length, i * 8, ns)));
    }
    if (specials.length){
      const pages = chunk(specials, 15);
      tl.add(sTier('special'));
      pages.forEach((p, i) => tl.add(sSpecial(p, i, pages.length, ss)));
    }
    tl.add(sOutro(S));
    currentHasSponsors = d.sponsors.length > 0;
    return tl;
  }
  window.__sponsorShow = { get timeline(){ return current; } };
  function run(){
    if (current) current.kill();
    current = buildShow(latest);
  }

  // ---------- demo data (?demo=1) ----------
  function demoLogo(text, bg, fg){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240"><rect width="600" height="240" rx="24" fill="${bg}"/><circle cx="110" cy="120" r="60" fill="${fg}" opacity=".9"/><text x="200" y="140" font-family="Arial Black,Arial" font-size="58" font-weight="900" fill="${fg}">${text}</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function demoData(){
    const sp = [
      ['Island Hardware Co.', 'major', demoLogo('ISLAND', '#0b1e3a', '#d4f22c')],
      ['Calapan Courts Club', 'major', null],
      ['Kusina Grill', 'minor', demoLogo('KUSINA', '#ffffff', '#c0362c')],
      ['Bayside Pharmacy', 'minor', null], ['Dink Masters PH', 'minor', demoLogo('DINK', '#ffffff', '#2a7f86')],
      ['Sunrise Bakery', 'minor', null], ['Metro Water Refilling', 'minor', null],
      ['Coach Ramon', 'special', null], ['Barangay Council', 'special', null], ['Volunteer Referees', 'special', null],
      ['PKL Box Staff', 'special', null], ['Mang Tony Catering', 'special', null], ['All Players & Families', 'special', null]
    ].map((s, i) => ({ id: 'd' + i, name: s[0], type: s[1], logo: s[2], order: i }));
    return { settings: Object.assign({}, SponsorStore.DEFAULT_SETTINGS, { eventName: DEFAULT_EVENT }), sponsors: sp };
  }

  // ---------- data ----------
  const status = $('status');
  $('fEvent').textContent = DEFAULT_EVENT;
  if (params.get('demo') === '1'){
    latest = demoData(); run();
  } else {
    status.textContent = 'Loading sponsors…';
    SponsorStore.subscribe(d => {
      status.textContent = '';
      const first = !latest;
      latest = d;
      $('fEvent').textContent = d.settings.eventName || DEFAULT_EVENT;
      if (first || (!ONCE && !currentHasSponsors && d.sponsors.length)) run();
    }, err => {
      status.textContent = 'Hindi maka-connect sa database (' + (err.code || 'error') + '). Check Firestore rules / internet.';
      if (ONCE) setTimeout(finishOnce, 4000);
    });
  }

  // ---------- controls: F = fullscreen, R = restart, double-click = fullscreen ----------
  addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') toggleFs();
    if ((e.key === 'r' || e.key === 'R') && latest && !ONCE) run();
  });
  stage.addEventListener('dblclick', toggleFs);
  function toggleFs(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); };
  addEventListener('mousemove', wake); wake();
})();
</script>
